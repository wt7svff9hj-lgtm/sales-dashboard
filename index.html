<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sales Dashboard">
<meta name="theme-color" content="#F2F3F5">
<meta name="format-detection" content="telephone=no">
<title>Sales Dashboard – Zeit, Umsatz &amp; Provision</title>
<script>try{var t=(JSON.parse(localStorage.getItem("quota_v1")||"{}").settings||{}).theme||"auto";var d=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";var sc=(JSON.parse(localStorage.getItem("quota_v1")||"{}").security||{});if(sc.pin)document.documentElement.classList.add("prelock")}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
.spx{display:inline-flex;align-items:center;gap:2px;font-style:normal;line-height:1}.spx s{text-decoration:none;opacity:.45;font-weight:600;font-size:.85em}.spx svg{width:14px;height:14px;flex:none}.cd .spx{font-size:13px;gap:1px}.cd span .spx{flex:none;overflow:visible}.cd span .spx svg{width:15px;height:15px;min-width:15px;flex:none}
:root{
  --canvas:#EEF0F5; --paper:#FFFFFF; --raise:#F6F7FA; --ink:#0A0B10; --ink2:#454A57; --muted:#868B99; --hair:#E5E7EE; --hair2:#D1D5DE; --line:rgba(10,11,16,.04);
  --hover:#F5F6F9; --slim:#FAFBFC; --shadow:0 1px 2px rgba(15,18,30,.04),0 8px 28px rgba(15,18,30,.06);
  --acc:#111318; --acc2:#F5C400; --accFill:#F9DC4A; --accLine:#E2BE12; --accSoft:#FFF4C4; --grad:linear-gradient(100deg,#FBE46C,#F6C700); --tY:#C99A00;
  --green:#12945A; --greenSoft:rgba(18,148,90,.11); --red:#D93036; --redSoft:rgba(217,48,54,.10); --amber:#B97A00; --amberSoft:rgba(232,160,20,.16);
  --u:#3DA35D; --uBg:#EBF6ED; --k:#0E9FB3; --kBg:#E4F6F8; --h:#9095A0; --hBg:#F1F2F4; --s:#C2557A; --sBg:#FBEAF0; --w:#9AA0AC; --wBg:#F0F1F4;
  --in:#D4A900; --out:#3A3F4B;
  --c0:#D93036; --c0t:#fff; --c1:#F8B4B0; --c1t:#7A1418; --c2:#FFE29E; --c2t:#5E4100; --c3:#26A065; --c3t:#fff; --empty:#F1F2F6;
  --tab:rgba(255,255,255,.96);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --cond:75%;
  color-scheme:light;
}
html[data-theme=dark]{
  --canvas:#06070B; --paper:#11131A; --raise:#181B24; --ink:#F3F4F8; --ink2:#B4B8C5; --muted:#7D8293; --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.14); --line:rgba(255,255,255,.06);
  --hover:#161922; --slim:#0E1016; --shadow:0 0 0 1px rgba(255,255,255,.05);
  --acc:#F9DC4A; --acc2:#F5C400; --accFill:#F9DC4A; --accLine:#F9DC4A; --accSoft:rgba(249,220,74,.13); --grad:linear-gradient(100deg,#FBE46C,#F6C700); --tY:#F9DC4A;
  --green:#34D186; --greenSoft:rgba(52,209,134,.13); --red:#FF5C61; --redSoft:rgba(255,92,97,.13); --amber:#F5B83D; --amberSoft:rgba(245,184,61,.14);
  --u:#4CC170; --uBg:rgba(76,193,112,.10); --k:#3CC8DA; --kBg:rgba(60,200,218,.10); --h:#9AA0AE; --hBg:rgba(154,160,174,.09); --s:#F07AA5; --sBg:rgba(240,122,165,.10); --w:#7D8293; --wBg:rgba(255,255,255,.035);
  --in:#F9DC4A; --out:#C9CCD6;
  --c0:#E0353C; --c0t:#fff; --c1:rgba(255,105,100,.30); --c1t:#FFC2BF; --c2:rgba(255,200,70,.26); --c2t:#FFE09A; --c3:#22A866; --c3t:#fff; --empty:#171A22;
  --tab:rgba(12,14,20,.96);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--canvas)}
html,body{margin:0;color:var(--ink);font-family:'Instrument Sans',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{background:var(--canvas);-webkit-user-select:none;user-select:none}
html[data-theme=dark] body{background:radial-gradient(900px 500px at 85% -10%,rgba(249,220,74,.08),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(249,220,74,.04),transparent 60%),var(--canvas)}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(var(--safeT) + 10px) 18px calc(var(--safeB) + 96px)}
.wrap{max-width:1240px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;height:44px}
.bar .sp{flex:1}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark .lg{width:32px;height:32px;border-radius:9px;overflow:hidden;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mark .lg svg{display:block;width:100%;height:100%}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);flex:none}
.ibtn svg{width:19px;height:19px}
.ibtn.acc{background:var(--grad);color:#111318;box-shadow:0 6px 18px rgba(220,180,0,.35)}
.title{display:flex;align-items:flex-end;gap:10px;margin:16px 0 20px;flex-wrap:wrap}
.title h1{margin:0;font-size:42px;line-height:1;font-weight:700;font-stretch:var(--cond);letter-spacing:-.01em}
.title .sp{flex:1}
.month{display:inline-flex;align-items:center;background:var(--paper);border-radius:999px;height:40px;padding:0 4px;box-shadow:var(--shadow)}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.month button svg{width:17px;height:17px}
.month span{font-weight:600;font-size:15px;min-width:120px;text-align:center}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--hair);display:flex;padding:6px 8px calc(var(--safeB) + 6px)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;max-width:120px;margin:0 auto;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:20px;transition:color .2s,background .2s}
.tabs a svg{width:23px;height:23px}
.tabs a.on{color:#111318;background:var(--accFill)}

@media (min-width:1000px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:3px;width:240px;flex:none;padding:calc(var(--safeT) + 24px) 16px 24px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
  .side .mark{padding:0 10px 28px}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:15px;transition:background .15s,color .15s}
  .side a svg{width:20px;height:20px}
  .side a:hover{background:var(--paper);color:var(--ink)}
  .side a.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow),inset 3px 0 0 var(--accFill)}
  .side .grow{flex:1}
  .main{padding:calc(var(--safeT) + 24px) 36px 56px}
  .bar .mark{display:none}
  .title h1{font-size:48px}
}

/* ---------- Surfaces ---------- */
.panel{background:var(--paper);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.panel.flush{padding:4px 20px}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.cols.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.cols.half{grid-template-columns:1fr 1fr}}
@media (min-width:1280px){.cols.three{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}}
@media (min-width:760px) and (max-width:1279px){.cols.three{grid-template-columns:1fr 1fr}.cols.three>:first-child{grid-column:1/-1}}
.sh{display:flex;align-items:center;gap:10px;margin:28px 2px 12px}
.sh h2{margin:0;white-space:nowrap;font-size:21px;font-weight:700;letter-spacing:-.01em}
.sh .sp{flex:1}
.sh .meta{color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.lbl{font-size:13.5px;color:var(--muted);font-weight:500}
.big{font-size:46px;line-height:1;font-weight:650;font-stretch:var(--cond);font-variant-numeric:tabular-nums}
.mid{font-size:28px;line-height:1.05;font-weight:650;font-stretch:var(--cond);font-variant-numeric:tabular-nums}
.gt{color:var(--ink);background:linear-gradient(transparent 58%,#F9DC4A 58%,#F9DC4A 90%,transparent 90%);padding:0 .06em}
html[data-theme=dark] .gt{color:#F9DC4A;background:none}

.figs{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.figs>div{padding:4px 16px}
.figs>div:first-child{padding-left:0}
.figs>div+div{border-left:1px solid var(--hair)}
.figs .v{font-size:28px;font-weight:650;font-stretch:var(--cond);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.figs .s{font-size:12.5px;color:var(--muted);margin-top:2px}
@media (max-width:560px){.figs.wrap4{--n:2!important;row-gap:16px}.figs.wrap4>div:nth-child(3){padding-left:0;border-left:0}}

.li{display:flex;align-items:center;gap:13px;padding:14px 0;min-height:58px;cursor:pointer;text-decoration:none;color:inherit;border-radius:12px;transition:background .15s}
.li+.li{border-top:1px solid var(--hair)}
.li .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);flex:none}
.li .ico svg{width:18px;height:18px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:15.5px}
.li .t small{display:block;color:var(--muted);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{text-align:right;font-weight:650;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .v small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.li .chev{color:var(--hair2);width:16px;height:16px;flex:none}

/* rail */
.rail{position:relative;margin:16px 0 28px}
.rail .tr{height:10px;border-radius:99px;background:var(--raise);overflow:hidden}
.rail .fl{height:100%;border-radius:99px;background:var(--grad);box-shadow:0 0 14px rgba(246,199,0,.45);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rail .fl.ok{background:linear-gradient(100deg,#12945A,#34D186);box-shadow:0 0 14px rgba(52,209,134,.4)}
.rail .g{position:absolute;top:-4px;width:2px;height:18px;background:var(--hair2);border-radius:2px}
.rail .g span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.rail .g.hit{background:var(--green)} .rail .g.hit span{color:var(--green)}
.rail.dark .tr{background:rgba(255,255,255,.14)} .rail.dark .g{background:rgba(255,255,255,.3)} .rail.dark .g span{color:rgba(255,255,255,.6)} .rail.dark .fl{background:var(--grad);box-shadow:0 0 16px rgba(249,220,74,.5)}

.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--raise);color:var(--ink2);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.g{background:var(--greenSoft);color:var(--green)} .chip.r{background:var(--redSoft);color:var(--red)} .chip.a{background:var(--amberSoft);color:var(--amber)} .chip.acc{background:var(--accSoft);color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:15px;font-weight:600;font-size:15.5px;background:var(--raise);color:var(--ink);transition:filter .15s,transform .1s}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--grad);color:#111318;box-shadow:0 8px 22px rgba(220,180,0,.35)}
.btn.white{background:#fff;color:#0A0B10}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.li:active,.day:active{opacity:.7}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}.li:hover{background:var(--hover);margin:0 -10px;padding-left:10px;padding-right:10px}.li:hover+.li{border-top-color:transparent}.day:hover{filter:brightness(.98)}html[data-theme=dark] .day:hover{filter:brightness(1.25)}.ibtn:hover,.month button:hover{color:var(--acc)}}
.row{display:flex;align-items:center;gap:10px}
.row .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.inp{width:100%;height:48px;padding:0 14px;border-radius:13px;border:1px solid var(--hair2);background:var(--raise);outline:none;font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none;transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--accLine);background:var(--paper)}
textarea.inp{height:auto;padding:12px 14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:38px;padding:0 13px;border-radius:12px;background:var(--raise);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--ink2);transition:all .15s}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--grad);color:#111318}
.seg.pill{display:inline-flex;background:var(--raise);padding:4px;border-radius:14px;gap:2px;flex-wrap:nowrap}
.seg.pill button{height:34px;background:none;border-radius:10px}
.seg.pill button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:34px;padding:0 12px;border-radius:10px;background:var(--raise);font-size:13.5px;font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid3.r{grid-template-columns:1fr 1fr}}

/* ---------- Hero (Stempeluhr, Ergebnis) ---------- */
.hero,.clock,.res,.tot{color:#fff;background:
  radial-gradient(90% 110% at 100% 0%,rgba(249,220,74,.30) 0%,transparent 55%),
  radial-gradient(70% 90% at 0% 100%,rgba(249,220,74,.12) 0%,transparent 60%),#121318;
  position:relative;overflow:hidden}
.clock{container-type:inline-size;border-radius:28px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.18)}

.hero>*,.clock>*,.res>*{position:relative;z-index:1}
.clock .top{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,.72);font-weight:500}
.clock .top .sp{flex:1}
.clock .top .st{display:inline-flex;align-items:center;gap:7px;color:#fff;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;font-weight:600;font-size:13px}
.clock .top .dot{width:8px;height:8px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 4px rgba(61,220,132,.25);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.clock .time{font-size:88px;line-height:.95;font-weight:600;font-stretch:var(--cond);margin:16px 0 6px;font-variant-numeric:tabular-nums;text-shadow:0 4px 30px rgba(0,0,0,.25)}
.clock .time.word{font-size:clamp(32px,15cqw,64px);white-space:nowrap}
.clock .time small{font-size:30px;color:rgba(255,255,255,.55);font-weight:500;margin-left:4px}
.clock .sub{color:rgba(255,255,255,.75);font-size:14.5px}
.clock .cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.clock .cell{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:10px 12px}
.clock .cell label{display:block;font-size:12.5px;color:rgba(255,255,255,.6);font-weight:500}
.clock .cell input{width:100%;min-width:0;background:transparent;border:0;color:#fff;font-size:22px;font-weight:600;font-stretch:var(--cond);outline:none;padding:2px 0 0;height:30px;-webkit-appearance:none;appearance:none;color-scheme:dark;font-variant-numeric:tabular-nums}
.clock .cell input::-webkit-calendar-picker-indicator{display:none}
.clock .cell input::placeholder{color:rgba(255,255,255,.4)}
.clock .acts{display:flex;gap:8px;margin-top:12px}
.clock .acts .btn{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.clock .acts .btn.white{background:#fff;color:#0A0B10;flex:1}
.res{border-radius:24px;padding:22px}
.res .lbl{color:rgba(255,255,255,.65)}
.tot{display:flex;align-items:flex-end;justify-content:space-between;border-radius:18px;padding:18px;margin-top:12px}
.tot span{color:rgba(255,255,255,.7);font-size:14px;font-weight:500}

/* ring */
.ringw{position:relative;width:132px;height:132px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringw .rt b{line-height:1;display:block}
.ringw .rt small{position:absolute;left:0;right:0;top:calc(50% + 24px);margin:0}
.ringw .rt b{font-size:30px;font-weight:650;font-stretch:var(--cond);line-height:1}
.ringw .rt small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}

/* week bars */
.wk{display:flex;gap:10px;align-items:flex-end;height:140px;position:relative;margin-top:6px}
.wk .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.wk .c i{display:block;width:100%;max-width:28px;border-radius:8px;background:var(--grad);min-height:4px;opacity:.9}
.wk .c i.off{background:var(--raise);opacity:1} .wk .c i.u{background:var(--u)}
.wk .c small{font-size:12px;color:var(--muted);font-weight:600}
.wk .c.today small{color:var(--ink);font-weight:700}
.wk .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--hair2)}

/* ---------- Days ---------- */
.weeks{display:block}
.weeks>div{break-inside:avoid;padding-top:1px}
@media (min-width:1180px){.weeks{columns:2;column-gap:18px}}
.wkh{display:flex;align-items:baseline;gap:8px;margin:22px 6px 8px;font-size:14px;color:var(--muted);font-weight:600}
.wkh .sp{flex:1}
.wkh b{color:var(--ink);font-weight:650}
.days{background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.day{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:12px 16px 12px 14px;position:relative;cursor:pointer;transition:filter .15s}
.day+.day{border-top:1px solid var(--hair)}
.day::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.day .dn{line-height:1.05;text-align:center}
.day .dn b{display:block;font-size:22px;font-weight:650;font-stretch:var(--cond);font-variant-numeric:tabular-nums}
.day .dn small{font-size:12px;color:var(--muted);font-weight:600}
.day .md{min-width:0}
.day .md b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .md b svg{width:15px;height:15px;flex:none}
.day .md small{display:block;font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .rv{text-align:right;font-variant-numeric:tabular-nums}
.day .rv b{display:block;font-weight:650;font-size:16px}

.moment{z-index:88;display:none;align-items:center}
.moment.on{display:flex}
.mo-in{max-width:420px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%;padding:20px 0}

.mo-kick{color:#F9DC4A;font-weight:700;font-size:15px;letter-spacing:.02em}
.mo-h{margin:0;font-size:40px;font-weight:700;font-stretch:var(--cond);line-height:1.05}
.mo-amt{font-size:64px;font-weight:700;font-stretch:var(--cond);line-height:1;font-variant-numeric:tabular-nums;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.mo-p{margin:0;color:rgba(255,255,255,.8);font-size:16px;line-height:1.45}.mo-p b{color:#fff}
.mo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:6px}
.mo-grid div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;text-align:left}
.mo-grid small{display:block;font-size:12px;color:rgba(255,255,255,.55)}.mo-grid b{display:block;font-size:24px;font-weight:650;font-stretch:var(--cond)}.mo-grid em{display:block;font-style:normal;font-size:12px;color:#4BE39A}
.mo-in .kk-bar{width:100%}
.mo-rec{background:rgba(249,220,74,.15);color:#F9DC4A;border-radius:12px;padding:10px 14px;font-weight:700}
.mo-in .kk-go{width:100%}
.wrapov{position:fixed;inset:0;z-index:89;display:none;background:#0B0C10;color:#fff}
.wrapov.on{display:block;animation:kin .45s cubic-bezier(.2,.8,.2,1)}.wrapov.out{animation:kout .35s ease forwards}
.wr-bars{position:absolute;top:calc(var(--safeT) + 10px);left:16px;right:60px;display:flex;gap:4px;z-index:3}
.wr-bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}.wr-bars i.d,.wr-bars i.a{background:#F9DC4A}
.wr-x{position:absolute;top:calc(var(--safeT) + 22px);right:14px;z-index:4}
.wr-tap{position:absolute;top:0;bottom:0;z-index:2}.wr-tap.l{left:0;width:35%}.wr-tap.r{right:0;width:65%}
.wr-s{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safeT) + 60px) 28px calc(var(--safeB) + 40px);max-width:520px;margin:0 auto;animation:fadein .35s ease}
.wr-s.y{background:#F9DC4A;color:#111318;max-width:none}
.wr-s.y>*{max-width:464px;width:100%;margin-left:auto;margin-right:auto}
.wr-s .kk-go{position:relative;z-index:5}
.wr-emo{font-size:72px;animation:bounce 1s cubic-bezier(.3,1.6,.5,1) both}

.wr-big{font-size:68px;line-height:1;font-weight:700;font-stretch:var(--cond);margin:8px 0 12px;font-variant-numeric:tabular-nums;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.wr-p{font-size:18px;line-height:1.45;margin:0 0 10px;color:inherit;opacity:.85}

.wr-split{display:flex;gap:10px;flex-wrap:wrap}.wr-split span{background:rgba(255,255,255,.08);padding:8px 12px;border-radius:12px}

.days,.panel,.tile,.daytile,.hero{contain:layout paint}
.weeks>div{content-visibility:auto;contain-intrinsic-size:auto 400px}
.sheet{will-change:transform}
.tabs a{transition:none}
.tabs a:active{transform:scale(.94)}

.schip{background:rgba(17,19,24,.1);color:#111318;padding:3px 10px;border-radius:99px;font-weight:700}

.sfx.mark{display:flex;align-items:flex-end;justify-content:flex-end;font-size:120px;opacity:.12;padding:0 10px 0 0;line-height:1;transform:rotate(-12deg) translate(14px,22px)}
.sfx.snow i{position:absolute;top:-8px;border-radius:50%;background:#fff;opacity:.95;animation:snow linear infinite;box-shadow:0 0 0 1px rgba(17,19,24,.10),0 1px 3px rgba(17,19,24,.15)}

.sfx.dots i{position:absolute;width:6px;height:6px;border-radius:2px;opacity:0;animation:twinkle 3s ease-in-out infinite}

.toast.on{opacity:1;transform:translate(-50%,0)}

.tip{position:fixed;z-index:70;background:var(--ink);color:var(--paper);font-size:13px;font-weight:500;padding:8px 11px;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:240px;line-height:1.4}
.tip.on{opacity:1}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.logos button{border-radius:20px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:14px;background:var(--raise);border:2px solid transparent}

.logos .lg svg{display:block;width:100%;height:100%}
.warn{display:flex;align-items:center;gap:8px;background:var(--redSoft);color:var(--red);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}
.warn svg{width:18px;height:18px;flex:none}
.fade{animation:fade .2s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#print{display:none}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;font-size:11px;color:#000;background:#fff}#print table{width:100%;border-collapse:collapse}#print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left}}

function worked(e){ if(!e||!e.start||!e.end)return null; let m=toMin(e.end)-toMin(e.start); if(m<0)m+=1440; m-=(+e.pause||0); return m/60; }
function dayInfo(k){
  const d=pD(k), wd=d.getDay(), weekend=wd===0||wd===6;
  const hol=holidays(d.getFullYear())[k]||null;

  const sollTag=+S.settings.sollTag, sollHalb=+S.settings.sollHalb;
  if(e){

    else{
      soll=(weekend||hol)?0:(e.type==='halb'?sollHalb:sollTag);
      if(w!=null){ist=w;counted=true}

    }

    if(weekend||hol||sp){counted=true}

function monthDays(m){const n=dim(m),a=[];for(let i=1;i<=n;i++)a.push(dayInfo(`${m}-${pad(i)}`));return a}
function monthStats(m){
  const days=monthDays(m);let sollAll=0,soll=0,ist=0,urlaub=0,missing=0,workDays=0;
  days.forEach(x=>{sollAll+=x.soll; if(x.counted){soll+=x.soll;ist+=x.ist}
    if(x.e&&x.e.type==='urlaub'&&!x.weekend&&!x.hol)urlaub+=1; if(x.e&&x.e.type==='halb')urlaub+=.5; if(x.sp)urlaub+=.5;

function compDaysAuto(m){let n=0;monthDays(m).forEach(x=>{if(x.weekend)return; if(x.e){if(isFree(x.e.type))n+=1;else if(x.e.type==='halb')n+=.5} else if(x.hol||x.sp)n+=1});return n}

}

function rail(p,gates=[70,100],dark=false){
  const mx=Math.max(Math.max(...gates)+20,Math.ceil((p+10)/10)*10);
  return `<div class="rail ${dark?'dark':''}"><div class="tr"><div class="fl ${p>=100?'ok':''}" style="width:${Math.min(p,mx)/mx*100}%"></div></div>${gates.map(g=>`<div class="g ${p>=g?'hit':''}" style="left:calc(${g/mx*100}% - 1px)"><span>${g} %</span></div>`).join('')}</div>`;
}

function bindTips(){
  const tip=document.getElementById('tip');
  document.querySelectorAll('[data-tip]').forEach(el=>{
    const show=()=>{tip.innerHTML=el.dataset.tip;tip.classList.add('on');const r=el.getBoundingClientRect();let x=r.left+r.width/2-tip.offsetWidth/2;x=Math.max(8,Math.min(x,innerWidth-tip.offsetWidth-8));let y=r.top-tip.offsetHeight-8;if(y<8)y=r.bottom+8;tip.style.left=x+'px';tip.style.top=y+'px'};
    el.addEventListener('mouseenter',show);el.addEventListener('mouseleave',()=>tip.classList.remove('on'));
    el.addEventListener('touchstart',show,{passive:true});el.addEventListener('touchend',()=>setTimeout(()=>tip.classList.remove('on'),1400));
  });
}

function ringG(p,size=148){
  const sw=13,c0=size/2,r=(size-sw)/2,C=2*Math.PI*r,f=Math.min(Math.max(p,0),100)/100;
  const th=.7*2*Math.PI,x1=c0+(r-sw/2-2)*Math.cos(th),y1=c0+(r-sw/2-2)*Math.sin(th),x2=c0+(r+sw/2+2)*Math.cos(th),y2=c0+(r+sw/2+2)*Math.sin(th);
  return `<div class="ringw" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle cx="${c0}" cy="${c0}" r="${r}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="${sw}"/><circle cx="${c0}" cy="${c0}" r="${r}" fill="none" stroke="${p>=100?'#4BE39A':'#F9DC4A'}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*f} ${C}"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#FFC53D" stroke-width="3" stroke-linecap="round"/></svg><div class="rt"><b>${fmtN(p,p<10&&p>0?1:0)}<span>%</span></b><small>vom Ziel</small></div></div>`;
}

const QUOTES_WORK=['Jeder Call bringt dich näher an die 70 %.','Ein Nein ist nur der Weg zum nächsten Ja.','Pipeline füllen, Takt halten.','Heute ist ein guter Tag für einen Abschluss.','Fokus auf die nächsten zwei Deals.','Kleine Schritte, große Quote.','Erst zuhören, dann abschließen.','Dranbleiben schlägt Talent.'];

function calendar(m){

    else if(x.hol){cls='feiertag';txt=sic('feiertag')}

  return `<div class="panel cal"><div class="cw">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cg">${cells.join('')}</div>

function dayRow(x,u){
  const e=x.e; let cls=x.type, t1='', t2='', rv='', slim=false; const tk=todayK();
  if(e){
    const T=TYPES[e.type]; t1=`${ic(T.i)}${T.l}`;
    if(isFree(e.type)){t2=e.type==='urlaub'&&u.idx[x.k]?`Urlaubstag ${one(u.idx[x.k])} von ${u.total}`:(x.hol||'');rv=`<small class="mut">neutral</small>`}
    else{
      t2=e.start?`${e.start} bis ${e.end||'jetzt'}, ${e.pause||0} min Pause`:'Noch keine Zeiten';
      if(e.type==='halb'&&u.idx[x.k])t2+=`, Urlaubstag ${one(u.idx[x.k])}`;
      rv=x.w!=null?`<b>${hm(x.w)}</b><small class="${x.ist-x.soll>=0?'pos':'neg'}">${sgn(x.ist-x.soll)}</small>`:(x.missing?`<b class="neg">fehlt</b>`:`<small class="mut">Soll ${fmtN(x.soll)} h</small>`);
    }
    if(e.note)t2=esc(e.note)+(t2?', '+t2.charAt(0).toLowerCase()+t2.slice(1):'');
  }else if(x.hol){t1=`${ic('flag')}${x.hol}`;t2='Feiertag';cls='feiertag'}
  else if(x.sp){t1=`<i class="spx">${spEmo(x.sp)}<s>/</s>${ic('plane')}</i>${x.sp}`;t2=`½ Tag geschenkt + ½ Pflichturlaub${u.idx[x.k]?`, Urlaubstag ${one(u.idx[x.k])} von ${u.total}`:''}`;cls='halb';rv=`<small class="mut">neutral</small>`}
  else if(x.weekend){t1=WDL[x.wd];slim=true}
  else if(x.missing){cls='missing';t1=`Kein Eintrag`;t2='Antippen zum Nachtragen';rv=`<b class="neg">−${fmtN(x.soll,2)}</b>`}
  else{t1=x.k===tk?'Heute':'Arbeitstag';t2='';rv=`<small class="mut">Soll ${fmtN(x.soll)} h</small>`}
  return `<div class="day ${cls} ${slim?'slim':''} ${x.k===tk?'today':''} ${x.k===FLASH?'flash':''}" onclick="editDay('${x.k}')">
    <div class="dn"><b>${pad(x.d.getDate())}</b><small>${WD[x.wd]}</small></div>
    <div class="md"><b>${t1}</b>${t2?`<small>${t2}</small>`:''}</div>
    <div class="rv">${rv}</div></div>`;
}

function editDay(k){const x0=dayInfo(k);if((x0.weekend||x0.hol||x0.sp)&&!S.days[k]){toast(x0.sp?`${x0.sp}: ½ Tag frei + ½ Pflichturlaub`:x0.hol?`${x0.hol}: keine Erfassung`:'Wochenende: keine Erfassung');return}const e=S.days[k]?{...S.days[k]}:{type:'arbeit',start:'',end:'',pause:0,note:''};ED={k,e};drawDaySheet()}

function saveRange(){const f=document.getElementById('rgf').value,t=document.getElementById('rgt').value,n=document.getElementById('rgn').value;if(!f||!t||t<f){toast('Bitte einen gültigen Zeitraum wählen');return}

function csvMonth(m){
  const st=monthStats(m);const carry=carryIn(m);
  const rows=[['Datum','Wochentag','Art','Arbeitsbeginn','Arbeitsende','Pause (Min)','Stunden','Stunden dezimal','Soll dezimal','Plus/Minus','Notiz']];
  st.days.forEach(x=>{const e=x.e||{};const art=e.type?TYPES[e.type].l:(x.hol?'Feiertag: '+x.hol:x.weekend?'Wochenende':'');
    rows.push([dLabel(x.k),WDL[x.wd],art,e.start||'',e.end||'',isFree(e.type)?'':(e.pause??''),x.w!=null?hm(x.w):'',x.w!=null?fmtN(x.w,2):'',x.counted||x.soll?fmtN(x.soll,2):'',x.counted?fmtN(x.ist-x.soll,2):'',e.note||''])});
  rows.push([]);rows.push(['Summe','','','','','',hm(st.ist),fmtN(st.ist,2),fmtN(st.soll,2),fmtN(st.saldo,2)]);
  if(carry!=null){rows.push(['Übertrag Vormonat','','','','','','','','',fmtN(carry,2)]);rows.push(['Stundenkonto Monatsende','','','','','','','','',fmtN(carry+st.saldo,2)])}
  return '﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c}).join(';')).join('\n');
}
function csvYear(y){let out='';for(let i=1;i<=12;i++){const m=`${y}-${pad(i)}`;if(m>ymOf(new Date()))break;out+=(i>1?'\n\n':'')+mLabel(m)+'\n'+csvMonth(m).replace('﻿','')}return '﻿'+out}
function download(name,content,mime){try{const b=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Download gestartet')}catch(e){toast('Download nicht möglich. Bitte „Kopieren“ nutzen.')}}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('In die Zwischenablage kopiert')}catch(e){toast('Kopieren nicht erlaubt')}}

/* ============================================================
   Verlauf (Heatmap)
   ============================================================ */
function vVerlauf(){
  const cy=new Date().getFullYear(); const years=[];for(let y=2020;y<=cy+1;y++)years.push(y);
  const mode=S.settings.heatBest||'year';
  const vals={};years.forEach(y=>{for(let i=1;i<=12;i++){const k=`${y}-${pad(i)}`;vals[k]=heatVal(k)}});
  const R=v=>Math.round(v);
  const bestRow={},bestCol={};
  for(let i=1;i<=12;i++){let b=-1;years.forEach(y=>{const v=vals[`${y}-${pad(i)}`].v;if(v!=null&&R(v)>b)b=R(v)});bestRow[i]=b}
  years.forEach(y=>{let b=-1;for(let i=1;i<=12;i++){const v=vals[`${y}-${pad(i)}`].v;if(v!=null&&R(v)>b)b=R(v)}bestCol[y]=b});
  const isBest=(y,i,v)=>v!=null&&(mode==='year'?R(v)===bestCol[y]:R(v)===bestRow[i]);
  const avgOf=y=>{const a=[];for(let i=1;i<=12;i++){const v=vals[`${y}-${pad(i)}`].v;if(v!=null)a.push(v)}return a.length?{v:a.reduce((s,x)=>s+x,0)/a.length,n:a.length,hit:a.filter(x=>x>=100).length}:null};
  const avgs=years.map(avgOf);
  const valid=avgs.map((a,i)=>a&&{y:years[i],...a}).filter(Boolean);
  const bestY=valid.reduce((b,a)=>!b||a.v>b.v?a:b,null);
  const curA=avgs[years.indexOf(cy)];
  let allHit=0,allN=0;valid.forEach(a=>{allHit+=a.hit;allN+=a.n});
  const bestCur=(()=>{let b=null;for(let i=1;i<=12;i++){const v=vals[`${cy}-${pad(i)}`].v;if(v!=null&&(!b||v>b.v))b={v,i}}return b})();
  const cur=ymOf(new Date());
  const P=v=>`${R(v)}<small>&#8239;%</small>`;
  const prevA=avgs[years.indexOf(cy-1)];
  const diff=curA&&prevA?curA.v-prevA.v:null;
  const maxAvg=Math.max(100,...valid.map(a=>a.v));
  return `${head()}
  <div class="vtiles">
    <div class="tile"><div class="ti" style="--tc:var(--tY)">${ic('trend')}</div><div class="tl">${cy} im Schnitt</div><div class="tv">${curA?R(curA.v):'–'}<small> %</small></div><div class="ts">${diff!=null?`<span class="${diff>=0?'pos':'neg'}">${diff>=0?'▲':'▼'} ${fmtN(Math.abs(diff))} Punkte</span> zu ${cy-1}`:''}</div></div>
    <div class="tile"><div class="ti" style="--tc:var(--amber)">${ic('trophy')}</div><div class="tl">Bester Monat ${cy}</div><div class="tv">${bestCur?R(bestCur.v):'–'}<small> %</small></div><div class="ts">${bestCur?MON[bestCur.i-1]:''}</div></div>
    <div class="tile"><div class="ti" style="--tc:var(--green)">${ic('crown')}</div><div class="tl">Bestes Jahr</div><div class="tv">${bestY?bestY.y:'–'}</div><div class="ts">${bestY?`Ø ${R(bestY.v)} %`:''}</div></div>
    <div class="tile"><div class="ti" style="--tc:var(--k)">${ic('flame')}</div><div class="tl">Über 100 %</div><div class="tv">${allHit}<small> von ${allN}</small></div><div class="ts">Monaten seit 2020</div></div>
  </div>
  <div class="panel" style="margin-top:14px">
    <div class="ptl">${ic('trend','class="pi"')}Ø Zielerreichung pro Jahr</div>
    <div class="lbl" style="margin-top:2px">Durchschnitt aller Monate eines Jahres. Die gestrichelte Linie markiert 100 %.</div>
    <div class="ybars"><div class="yl" style="bottom:${100/maxAvg*120+30}px"><span>100 %</span></div>${years.map((y,j)=>{const a=avgs[j];return `<div class="yc ${y===cy?'cur':''} ${bestY&&y===bestY.y?'top':''}" data-tip="${y}: ${a?fmtP(a.v,1)+', '+a.n+' Monate':'keine Daten'}">${a?`<b>${R(a.v)}<small> %</small></b><i class="${heatCls(a.v)}" style="height:${a.v/maxAvg*120}px">${bestY&&y===bestY.y?ic('crown'):''}</i>`:'<i class="none"></i>'}<small class="yy">${y}</small><em class="run">${y===cy?'läuft':''}</em></div>`}).join('')}</div>
  </div>
  <div class="sh"><h2>${ic('trophy','class="pi"')}Rekorde</h2></div>
  <div class="vtiles">${(()=>{const rc=records();return `
    <div class="tile"><div class="ti" style="--tc:var(--amber)">${ic('crown')}</div><div class="tl">Beste Zielerreichung</div><div class="tv">${rc.best?R(rc.best.v):'–'}<small> %</small></div><div class="ts">${rc.best?mLabel(rc.best.src):''}</div></div>
    <div class="tile"><div class="ti" style="--tc:var(--in)">${ic('brief')}</div><div class="tl">Größter Deal</div><div class="tv">${rc.big?fmtE(rc.big.amount):'–'}</div><div class="ts">${rc.big?dLabel(rc.big.date):'ab jetzt in der App'}</div></div>
    <div class="tile"><div class="ti" style="--tc:var(--k)">${ic('users')}</div><div class="tl">Meiste Deals</div><div class="tv">${rc.most?rc.most.n:'–'}</div><div class="ts">${rc.most?mLabel(rc.most.m):''}</div></div>
    <div class="tile"><div class="ti" style="--tc:var(--green)">${ic('flame')}</div><div class="tl">Aktuelle Serie</div><div class="tv">${monthStreak()}<small> Monate</small></div><div class="ts">über 70 % in Folge</div></div>`})()}</div>
  <div class="sh" id="badges"><h2>${ic('shield','class="pi"')}Abzeichen</h2><span class="sp"></span><span class="meta">${earnedBadges().length} von ${BADGES.length}</span></div>
  <div class="panel">${badgeShelf()}</div>
  <div class="sh"><h2>${ic('zap','class="pi"')}Rückblicke</h2></div>
  <div class="grid2">${(()=>{const pm=addM(ymOf(new Date()),-1);const cm=ymOf(new Date());const opts=[pm,cm].filter(m=>m>=S.settings.startMonth);return opts.map(m=>`<button class="btn block" onclick="showWrap('m','${m}')">🎬 ${mLabel(m)}</button>`).join('')+`<button class="btn block" onclick="showWrap('y','${cy}')">🎆 Jahr ${cy}</button>`})()}</div>
  <div style="height:14px"></div>
  <div class="panel" style="margin-top:14px">
    <div class="row" style="flex-wrap:wrap;gap:10px">
      <div class="lbl">Bester Monat hervorheben</div><span class="sp"></span>
      <div class="seg pill"><button class="${mode==='year'?'on':''}" onclick="S.settings.heatBest='year';save();render()">${ic('trophy')}Je Jahr</button><button class="${mode==='month'?'on':''}" onclick="S.settings.heatBest='month';save();render()">${ic('grid')}Vergleich Vorjahre</button></div>
    </div>
    <div class="hmwrap"><table class="hm hml">
      <tr class="hh"><th></th></tr>
      ${MONS.map(mn=>`<tr><th class="m">${mn}</th></tr>`).join('')}
      <tr class="sep"><th></th></tr>
      <tr class="avg"><th class="m">Ø Jahr</th></tr>
    </table>
    <div class="hmx"><table class="hm">
      <tr class="hh">${years.map(y=>`<th class="${y===cy?'cy':''}"><span>${y}</span></th>`).join('')}</tr>
      ${MONS.map((mn,i)=>`<tr>${years.map(y=>{const k=`${y}-${pad(i+1)}`;const h=vals[k];
        if(h.v==null)return `<td class="${k>cur?'f':'e'}" ${k<=addM(cur,1)&&!h.auto?`onclick="heatSheet('${k}')" style="cursor:pointer"`:''}></td>`;
        const b=isBest(y,i+1,h.v);
        return `<td class="${heatCls(h.v)} ${b?'best':''} ${h.live?'live':''}" onclick="heatSheet('${k}')" data-tip="<b>${MON[i]} ${y}: ${fmtP(h.v,1)}</b><br>Leistung aus ${mLabel(h.src)}${h.auto?'<br>aus deinen Umsätzen':''}${h.live?', läuft noch':''}${b?(mode==='year'?'<br>Bester Monat '+y:'<br>Bester '+MON[i]+' aller Jahre'):''}">${P(h.v)}</td>`}).join('')}</tr>`).join('')}
      <tr class="sep"><td colspan="${years.length}"></td></tr>
      <tr class="avg">${avgs.map((a,j)=>a==null?'<td></td>':`<td><span class="${heatCls(a.v)} ${bestY&&years[j]===bestY.y?'best':''}">${R(a.v)}&#8239;%</span></td>`).join('')}</tr>
    </table></div></div>
    <div class="hmleg">
      <span class="k"><span class="sw" style="background:var(--c0)"></span>unter 50 %</span>
      <span class="k"><span class="sw" style="background:var(--c1)"></span>unter 70 %</span>
      <span class="k"><span class="sw" style="background:var(--c2)"></span>70 bis 100 %</span>
      <span class="k"><span class="sw" style="background:var(--c3)"></span>ab 100 %</span>
      <span class="k"><span class="star"></span>${mode==='year'?'bester Monat des Jahres':'bester Monat im Vergleich der Jahre'}</span>
      <span class="k"><span class="sw" style="outline:2px dashed var(--ink);outline-offset:-2px"></span>läuft noch</span>
    </div>
  </div>
  <p class="hint" style="margin:14px 4px 0">Zielerreichung ohne Urlaubsberücksichtigung, immer einen Monat verzögert: Umsatz im November steht im Dezember, weil die Provision im Folgemonat kommt. Werte bis November 2026 stammen aus deiner Excel und bleiben fest, auch wenn du frühere Umsätze nachträgst. Ab Dezember 2026 (Leistung November) rechnet die App selbst.</p>`;
}

function yearReport(y){
  const tk=todayK(); const months=[]; const tot={work:0,office:0,home:0,urlaub:0,krank:0,feiertag:0,weekend:0,hours:0};
  for(let i=1;i<=12;i++){const m=`${y}-${pad(i)}`;const r={m,work:0,office:0,urlaub:0,krank:0,feiertag:0,hours:0};
    monthDays(m).forEach(x=>{if(x.k>tk||x.k<S.settings.startMonth+'-01')return;const e=x.e;
      if(e&&!isFree(e.type)&&x.w>0){r.work++;r.hours+=x.w;if(e.type==='koeln')r.office++;if(x.weekend||x.hol)tot.weekend++}
      if(x.weekend)return;
      if(e&&e.type==='urlaub'&&!x.hol)r.urlaub++; if(e&&e.type==='halb')r.urlaub+=.5; if(x.sp)r.urlaub+=.5;
      if(e&&e.type==='krank'&&!x.hol)r.krank++;
      if(x.hol||(e&&e.type==='feiertag'))r.feiertag++;});
    months.push(r);['work','office','urlaub','krank','feiertag','hours'].forEach(k=>tot[k]+=r[k]);}
  tot.home=tot.work-tot.office; tot.urlaubVorher=+(S.settings.urlaubVorher[y]||0); tot.urlaubAll=tot.urlaub+tot.urlaubVorher; return {y,months,tot};
}

  R.months.forEach(r=>rows.push([MON[+r.m.slice(5)-1],r.work,r.office,r.work-r.office,fmtN(r.urlaub,1),r.krank,r.feiertag,fmtN(r.hours,2)]));
  const t=R.tot;rows.push(['Summe',t.work,t.office,t.home,fmtN(t.urlaub,1),t.krank,t.feiertag,fmtN(t.hours,2)]);rows.push([]);rows.push(['davon an Wochenenden/Feiertagen gearbeitet',t.weekend]);if(t.urlaubVorher)rows.push(['Urlaubstage vor App-Start',fmtN(t.urlaubVorher,1)]);rows.push(['Urlaubstage gesamt',fmtN(t.urlaubAll,1)]);rows.push([`Erfasst ab ${mLabel(S.settings.startMonth)}`]);
  return '﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c}).join(';')).join('\n')}

const SEC=()=>S.security||(S.security={});
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sd-salt:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let LOCKED=false,PINBUF='',FAILS=0,LOCKUNTIL=0,HIDDEN_AT=0;
const lockActive=()=>!!SEC().pin;
function padHtml(fn,face){return `<div class="lk-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="${fn}('${n}')"><b>${n}</b></button>`).join('')}<button class="fn" onclick="tryFace()" ${face?'':'style="visibility:hidden"'} aria-label="Face ID">${ic('faceid')}</button><button onclick="${fn}('0')"><b>0</b></button><button class="fn" onclick="${fn}('del')" aria-label="Löschen">${ic('del')}</button></div>`}
function showLock(){if(!lockActive())return;LOCKED=true;PINBUF='';const el=document.getElementById('lock');
  el.innerHTML=`<div class="lk-in"><div class="lk-logo">${logoSvg(S.settings.logo)}</div><div class="lk-hi">${greet()}${S.settings.name?', '+esc(S.settings.name):''} ${greetEmo()}</div><div class="lk-sub" id="lkSub">PIN eingeben</div><div class="lk-dots" id="lkDots"><i></i><i></i><i></i><i></i></div>${SEC().faceId?`<button class="lk-face" onclick="tryFace()">${ic('faceid')} Mit Face ID entsperren</button>`:''}${padHtml('pinKey',!!SEC().faceId)}<button class="lk-forgot" onclick="forgotPin()">PIN vergessen?</button><div class="lk-ver">Version ${APP_VERSION}</div></div>`;
  el.classList.remove('out');el.classList.add('on');document.documentElement.classList.add('islocked');document.documentElement.classList.remove('prelock');}
function dots(n,err){const d=document.getElementById('lkDots');if(!d)return;[...d.children].forEach((x,i)=>x.classList.toggle('f',i<n));d.classList.toggle('err',!!err);if(err){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}}
async function pinKey(k){if(Date.now()<LOCKUNTIL)return;if(k==='del'){PINBUF=PINBUF.slice(0,-1);dots(PINBUF.length);return}if(PINBUF.length>=4)return;PINBUF+=k;dots(PINBUF.length);
  if(PINBUF.length===4){const h=await sha(PINBUF);if(h===SEC().pin){FAILS=0;unlock()}else{FAILS++;dots(4,true);if(navigator.vibrate)try{navigator.vibrate([30,40,30])}catch(e){}const sub=document.getElementById('lkSub');
    if(FAILS>=5){LOCKUNTIL=Date.now()+30000;sub.textContent='Zu viele Versuche. Bitte 30 Sekunden warten.';setTimeout(()=>{FAILS=0;const s2=document.getElementById('lkSub');if(s2)s2.textContent='PIN eingeben'},30000)}else sub.textContent='Falsche PIN, bitte nochmal';
    setTimeout(()=>{PINBUF='';dots(0)},450)}}}
function unlock(){LOCKED=false;const el=document.getElementById('lock');el.classList.add('out');document.documentElement.classList.remove('islocked','prelock');setTimeout(()=>{el.classList.remove('on','out');el.innerHTML=''},420);setTimeout(()=>afterInitial(dailyFlow),450)}
async function tryFace(auto){try{if(!SEC().faceId||!window.PublicKeyCredential)throw 0;await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(SEC().faceId)}],userVerification:'required',timeout:60000}});unlock()}catch(e){if(!auto){const s=document.getElementById('lkSub');if(s)s.textContent='Face ID hat nicht geklappt, bitte PIN eingeben'}}}
function forgotPin(){const el=document.querySelector('#lock .lk-in');el.innerHTML=`<div class="lk-logo">${logoSvg(S.settings.logo)}</div><div class="lk-hi">PIN vergessen?</div><p class="lk-txt">Ohne PIN lässt sich die App nur zurücksetzen. Dabei werden alle Daten auf diesem Gerät gelöscht. Hast du ein Backup, kannst du es danach wieder einspielen.</p><div class="stack" style="width:100%;max-width:300px"><button class="btn block" onclick="showLock()">Abbrechen</button><button class="btn danger block" onclick="try{localStorage.removeItem(LS_KEY)}catch(e){};location.reload()">Alles löschen und neu starten</button></div>`}
document.addEventListener('visibilitychange',()=>{if(document.hidden){HIDDEN_AT=Date.now();return}
  if(lockActive()&&!LOCKED&&HIDDEN_AT&&Date.now()-HIDDEN_AT>=(+(SEC().after??1))*60000)showLock();else if(!LOCKED){if(syncOn())pullNow().finally(()=>dailyFlow());else dailyFlow()}});

let PS=null;
function pinSheet(mode){PS={mode,step:lockActive()?0:1,first:'',buf:''};drawPin()}
function drawPin(){const t={0:'Aktuelle PIN',1:'Neue PIN',2:'Neue PIN wiederholen'}[PS.step];
  openSheet(`${sheetHead(PS.mode==='off'?'PIN entfernen':lockActive()?'PIN ändern':'PIN festlegen')}<div class="pin-setup"><div class="lk-sub" id="psSub" style="color:var(--muted)">${PS.mode==='off'&&PS.step===0?'Zum Entfernen aktuelle PIN eingeben':t}</div><div class="lk-dots light" id="psDots">${[0,1,2,3].map(i=>`<i class="${i<PS.buf.length?'f':''}"></i>`).join('')}</div>${padHtml('psKey',false)}</div>`)}
async function psKey(k){if(k==='del'){PS.buf=PS.buf.slice(0,-1)}else if(PS.buf.length<4)PS.buf+=k;const d=document.getElementById('psDots');[...d.children].forEach((x,i)=>x.classList.toggle('f',i<PS.buf.length));if(PS.buf.length<4)return;
  const bad=m=>{document.getElementById('psSub').textContent=m;d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake','err');setTimeout(()=>{PS.buf='';drawPin();document.getElementById('psSub').textContent=m},500)};
  if(PS.step===0){if(await sha(PS.buf)!==SEC().pin)return bad('Falsche PIN');if(PS.mode==='off'){delete SEC().pin;delete SEC().faceId;save();closeSheet();render();toast('PIN entfernt','ok');return}PS.step=1;PS.buf='';return drawPin()}
  if(PS.step===1){PS.first=PS.buf;PS.step=2;PS.buf='';return drawPin()}
  if(PS.buf!==PS.first){PS.step=1;PS.first='';return bad('PINs stimmen nicht überein, nochmal')}
  SEC().pin=await sha(PS.buf);if(SEC().after==null)SEC().after=1;save();closeSheet();render();toast('PIN gespeichert','ok')}
async function enableFace(){try{if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))throw 0;

  SEC().faceId=b64(cred.rawId);save();render();toast('Face ID aktiviert','ok')}catch(e){toast('Face ID geht hier nicht. In der GitHub-Version auf iPhone oder iPad klappt es.')}}

function gong(){if(!S.settings.sound)return;try{const A=new (window.AudioContext||window.webkitAudioContext)();const t=A.currentTime;[[196,.5],[392,.35],[587,.22],[784,.15],[1046,.08]].forEach(([f,v])=>{const o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.985,t+3);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g).connect(A.destination);o.start(t);o.stop(t+3.3)})}catch(e){}}

function tempo(m){const tk=todayK();const total=workdaysLeft(m,m+'-01');const left=workdaysLeft(m,tk);const done=Math.max(0,total-left);const share=total?done/total:0;
  const r=rev(m);const need=70*share;let st='green',lbl='Auf Kurs',txt;
  if(!r.target){st='none';lbl='Kein Ziel';txt='Lege ein Monatsziel fest.'}
  else if(r.pct>=100){lbl='Ziel erreicht';txt='Alles ab jetzt ist Bonus.'}
  else if(r.pct>=70){lbl='Provision läuft';txt=`Bis 100 % fehlen noch ${fmtE(r.target-r.tot)}.`}
  else if(done===0){st='green';lbl='Start frei';txt=`Für 70 % brauchst du ${fmtE(r.target*.7)} in ${one(total)} Arbeitstagen.`}
  else{st=r.pct>=need?'green':r.pct>=need*.6?'yellow':'red';lbl={green:'Auf Kurs',yellow:'Knapp dran',red:'Gas geben'}[st];txt=`Für 70 % solltest du heute bei ${fmtN(need)} % stehen. Du bist bei ${fmtN(r.pct)} %.`}
  return {st,lbl,txt,share,need}}

  let wdN=0;days.forEach(k=>{const x=dayInfo(k);if(x.weekend||x.hol||x.sp)return;if(x.e&&isFree(x.e.type))return;wdN+=(x.e&&x.e.type==='halb')?.5:1});
  const total=workdaysLeft(m,m+'-01');const r=rev(m);const goal=total?r.target*wdN/total:0;const got=S.deals.filter(d=>!d.retro&&days.includes(d.date)).reduce((s,d)=>s+ +d.amount,0);return {goal,got,wdN}}

function seasonFx(se){if(!se)return '';if(se.fx==='snow')return `<div class="sfx snow">${[...Array(14)].map((_,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${(i*0.7)%6}s;animation-duration:${6+(i%5)}s;width:${3+(i%3)}px;height:${3+(i%3)}px"></i>`).join('')}</div>`;

/* ---------- Easter Eggs ---------- */

/* ---------- Cloud-Sync über GitHub (privates Daten-Repository) ---------- */
const SYNC_KEY='sd_sync';
let SY=(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY)||'null')}catch(e){return null}})();
let initialPulled=true,bootTs=0,_afterQ=[],pendingPush=false;
let syncState='local',syncAt=0,pushTimer=null,pulling=false,pushing=false,dirty=false,pushAgain=false,syncErr='';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('sales-dashboard',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');v==null?t.objectStore('kv').delete(k):t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
const saveSY=()=>{try{SY?localStorage.setItem(SYNC_KEY,JSON.stringify(SY)):localStorage.removeItem(SYNC_KEY)}catch(e){}idbSet(SYNC_KEY,SY?JSON.parse(JSON.stringify(SY)):null)};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const syncOn=()=>!!(SY&&SY.token&&SY.owner&&SY.repo);
const ghUrl=()=>`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}/contents/${SY.path||'data.json'}`;
const ghH=(x={})=>({'Authorization':'Bearer '+SY.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...x});
const enc=s=>btoa(unescape(encodeURIComponent(s)));const dec=b=>decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))));
/* Verschlüsselung (AES-GCM, Schlüssel aus Passwort via PBKDF2) */
const b64s=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64s=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,saltB64){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64s(saltB64),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);return b64s(await crypto.subtle.exportKey('raw',k))}
let _ck=null;async function cryptoKey(raw){raw=raw||(SY&&SY.key);if(!raw)return null;if(_ck&&_ck.raw===raw)return _ck.k;const k=await crypto.subtle.importKey('raw',unb64s(raw),'AES-GCM',false,['encrypt','decrypt']);_ck={raw,k};return k}
async function packData(obj){const json=JSON.stringify(obj);const k=await cryptoKey();if(!k)return json;const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(json));return JSON.stringify({enc:'aes-256-gcm/pbkdf2-sha256',v:1,salt:SY.salt,iv:b64s(iv),_ts:obj._ts||0,data:b64s(ct)})}
async function unpackData(text,raw){const o=JSON.parse(text);if(!o||!o.enc)return o;const k=await cryptoKey(raw);if(!k)throw 'locked';try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64s(o.iv)},k,unb64s(o.data));return JSON.parse(new TextDecoder().decode(pt))}catch(e){throw 'badpw'}}
function syncPayload(){const c=JSON.parse(JSON.stringify(S));if(c.security)delete c.security.faceId;return c}
function setSync(st,err){syncState=st;if(st==='ok')syncAt=Date.now();if(err!=null)syncErr=String(err);paintSync()}
function agoTxt(t){if(!t)return '';const s=Math.round((Date.now()-t)/1000);return s<5?'gerade eben':s<60?`vor ${s} s`:s<3600?`vor ${Math.floor(s/60)} min`:`vor ${Math.floor(s/3600)} h`}
function paintSync(){const el=document.getElementById('syncbar');if(!el)return;
  const m={ok:['ok','cloudok',`Synchronisiert, ${agoTxt(syncAt)}`],saving:['busy','cloud','Speichert in der Cloud…'],local:['loc','device','Auf diesem Gerät gespeichert'],offline:['warn','cloudoff','Offline, wird später synchronisiert'],error:['err','cloudoff','Sync-Fehler, antippen für Details']}[syncState]||['loc','device','Auf diesem Gerät gespeichert'];
  el.className='syncbar '+m[0];el.innerHTML=`<span class="sd"></span>${ic(m[1])}<span>${m[2]}</span>`}
async function pushNow(){if(!syncOn())return setSync('local');if(pushing){pushAgain=true;return}pushing=true;
  try{const body={message:'Sync '+new Date().toISOString(),content:enc(await packData(syncPayload()))};if(SY.sha)body.sha=SY.sha;
    let r=await fetch(ghUrl(),{method:'PUT',headers:ghH({'Content-Type':'application/json'}),body:JSON.stringify(body),cache:'no-store'});
    if(r.status===409||r.status===422){const g=await fetch(ghUrl(),{headers:ghH(),cache:'no-store'});if(g.ok){SY.sha=(await g.json()).sha;body.sha=SY.sha}else{delete body.sha;SY.sha=null}
      r=await fetch(ghUrl(),{method:'PUT',headers:ghH({'Content-Type':'application/json'}),body:JSON.stringify(body),cache:'no-store'})}
    if(!r.ok)throw r.status;const j=await r.json();SY.sha=j.content.sha;SY.etag=null;saveSY();dirty=false;setSync('ok')}
  catch(e){setSync(navigator.onLine?'error':'offline',e===401?'Token ungültig oder abgelaufen':e===404?'Repository nicht gefunden oder kein Zugriff':e===403?'Kein Schreibrecht (Token-Berechtigung „Contents: Read and write“ prüfen)':'Fehler '+e)}
  finally{pushing=false;if(pushAgain){pushAgain=false;pushNow()}}}
function schedulePush(){if(!syncOn()){setSync('local');return}if(!initialPulled){pendingPush=true;setSync('saving');return}dirty=true;setSync('saving');clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,600)}
function finishBoot(){if(initialPulled)return;initialPulled=true;if(pendingPush){pendingPush=false;schedulePush()}const q=_afterQ;_afterQ=[];q.forEach(f=>f())}
function afterInitial(fn){if(initialPulled)fn();else _afterQ.push(fn)}
async function pullNow(force){if(!syncOn()||pulling||pushing||(dirty&&!force))return;pulling=true;
  try{const r=await fetch(ghUrl(),{headers:ghH(SY.etag&&!force?{'If-None-Match':SY.etag}:{}),cache:'no-store'});
    if(r.status===304){setSync('ok');return}
    if(r.status===404){SY.sha=null;saveSY();schedulePush();return}
    if(!r.ok)throw r.status;SY.etag=r.headers.get('ETag');const j=await r.json();
    if(j.sha!==SY.sha){const remote=await unpackData(dec(j.content));SY.sha=j.sha;saveSY();if((remote._ts||0)>(force==='boot'?bootTs:(S._ts||0))){adoptRemote(remote);pendingPush=false}}else saveSY();
    setSync('ok')}
  catch(e){setSync(navigator.onLine?'error':'offline',e===401?'Token ungültig oder abgelaufen':e==='locked'?'Die Cloud-Daten sind verschlüsselt. Verbindung trennen und mit Passwort neu verbinden.':e==='badpw'?'Passwort passt nicht zu den Cloud-Daten':'Fehler '+e)}finally{pulling=false;if(force==='boot')finishBoot()}}
function adoptRemote(remote){const fid=S.security&&S.security.faceId;try{localStorage.setItem(LS_KEY,JSON.stringify(remote))}catch(e){}load();if(fid){S.security=S.security||{};S.security.faceId=fid;_rawSave()}
  applyTheme();const busy=document.getElementById('sheet').classList.contains('on')||LOCKED||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));if(!busy)render();else _needRender=true}
let _needRender=false;document.addEventListener('focusout',()=>{if(_needRender){setTimeout(()=>{if(_needRender&&!document.getElementById('sheet').classList.contains('on')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){_needRender=false;render()}},300)}});
const _rawSave=save;save=function(){S._ts=Date.now();_rawSave();schedulePush()};
setInterval(()=>{if(!document.hidden)pullNow()},3000);setInterval(paintSync,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullNow()});
window.addEventListener('online',()=>{dirty?pushNow():pullNow()});
let SC=null;
function syncSheet(){const on=syncOn();
  openSheet(`${sheetHead('Cloud-Sync')}
   <div class="syncinfo ${syncState}">${ic(syncState==='ok'?'cloudok':syncState==='local'?'device':'cloud')}<div><b>${on?(syncState==='ok'?'Verbunden und synchronisiert':syncState==='error'?'Verbunden, aber Fehler':'Verbunden'):'Nicht verbunden'}</b><div class="lbl">${on?`${esc(SY.owner)}/${esc(SY.repo)}${syncAt?', zuletzt '+agoTxt(syncAt):''}`:'Daten liegen nur auf diesem Gerät.'}</div>${on?`<div class="lbl" style="margin-top:2px">${SY.key?'🔒 Verschlüsselt mit deinem Passwort':'Nicht verschlüsselt'}</div>`:''}${syncState==='error'&&syncErr?`<div class="lbl neg">${esc(syncErr)}</div>`:''}</div></div>
   ${on?`<div class="stack" style="margin-top:14px"><button class="btn pri block" onclick="pullNow(true).then(()=>{if(!dirty)pushNow()});toast('Synchronisiere…')">${ic('cloud')} Jetzt synchronisieren</button><button class="btn block" onclick="SY.token='';saveSY();syncSheet()">${ic('edit')} Token ändern</button><button class="btn danger block" onclick="SY=null;saveSY();setSync('local');closeSheet();render();toast('Cloud-Sync getrennt','ok')">Verbindung trennen</button></div><p class="hint">Änderungen werden nach etwa einer Sekunde hochgeladen, andere Geräte holen sie alle drei Sekunden ab.</p>`:`
   <div class="stack" style="margin-top:14px">
    <div class="field"><label>GitHub-Benutzername</label><input class="inp" id="syO" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(SY?.owner||'')}" placeholder="z. B. alexander-mustermann"></div>
    <div class="field"><label>Name des privaten Daten-Repositorys</label><input class="inp" id="syR" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(SY?.repo||'sales-dashboard-data')}"></div>
    <div class="field"><label>Token (beginnt mit github_pat_)</label><input class="inp" id="syT" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></div>
    <div class="field"><label>Verschlüsselungs-Passwort (mind. 10 Zeichen)</label><input class="inp" id="syP" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Auf allen Geräten gleich"></div>
    <button class="btn pri block" onclick="syncConnect()">${ic('cloud')} Verbinden</button>
   </div>${/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone?`<div class="warn" style="margin-top:12px">${ic('alert')} Du bist gerade in Safari. Öffne die App über das Icon auf dem Home-Bildschirm und verbinde dort, sonst wirst du dort erneut gefragt.</div>`:''}<p class="hint">Token und Passwort bleiben nur auf diesem Gerät. In GitHub liegt nur verschlüsselter Text. Das Passwort gut merken: Ohne es lassen sich die Cloud-Daten nicht mehr öffnen.</p>`}`)}
async function syncConnect(){const o=document.getElementById('syO').value.trim(),r=document.getElementById('syR').value.trim(),t=document.getElementById('syT').value.trim(),pw=document.getElementById('syP').value;
  if(!o||!r||!t){toast('Bitte Benutzername, Repository und Token ausfüllen');return}
  if(pw&&pw.length<10){toast('Das Passwort sollte mindestens 10 Zeichen haben');return}
  const prev=SY;let validated=false;SY={owner:o,repo:r,token:t,path:'data.json'};toast('Prüfe Verbindung…');
  try{const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}`,{headers:ghH(),cache:'no-store'});
    if(rr.status===401)throw 'Der Token ist ungültig oder abgelaufen.';if(rr.status===404)throw 'Repository nicht gefunden. Prüfe Benutzername, Repository-Name und ob der Token Zugriff auf dieses Repository hat.';if(!rr.ok)throw 'GitHub antwortet mit Fehler '+rr.status+'.';
    validated=true;saveSY();const g=await fetch(ghUrl(),{headers:ghH(),cache:'no-store'});
    if(g.status===404){if(pw){SY.salt=b64s(crypto.getRandomValues(new Uint8Array(16)));SY.key=await deriveKey(pw,SY.salt)}SY.sha=null;saveSY();await pushNow();if(syncState==='ok'){closeSheet();render();toast('Verbunden. Deine Daten liegen jetzt in der Cloud','ok')}else{syncSheet()}return}
    if(!g.ok)throw 'Fehler '+g.status+' beim Lesen der Daten.';
    const j=await g.json();const txt=dec(j.content);const raw=JSON.parse(txt);let remote;
    if(raw&&raw.enc){if(!pw)throw 'Die Cloud-Daten sind verschlüsselt. Bitte dein Passwort eingeben.';toast('Entschlüssele…');SY.salt=raw.salt;SY.key=await deriveKey(pw,raw.salt);try{remote=await unpackData(txt,SY.key)}catch(e){throw 'Das Passwort ist falsch.'}}
    else{remote=raw;if(pw){SY.salt=b64s(crypto.getRandomValues(new Uint8Array(16)));SY.key=await deriveKey(pw,SY.salt)}}
    SC={sha:j.sha,remote};saveSY();
    const rs=SC.remote;const when=rs._ts?new Date(rs._ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'unbekannt';
    openSheet(`${sheetHead('Daten in der Cloud gefunden')}<p class="hint" style="margin-top:-6px">In deinem Repository liegen schon Daten (Stand ${when}). Was soll passieren?</p>
     <div class="stack"><button class="btn pri block" onclick="SY.sha=SC.sha;saveSY();adoptRemote(SC.remote);closeSheet();setSync('ok');render();toast('Cloud-Daten übernommen','ok')">${ic('down')} Cloud-Daten übernehmen</button>
     <p class="hint" style="margin:0">Empfohlen auf dem zweiten Gerät, z. B. dem iPad.</p>
     <button class="btn block" onclick="SY.sha=SC.sha;saveSY();S._ts=Date.now();_rawSave();pushNow().then(()=>{closeSheet();render();toast('Dieses Gerät hochgeladen','ok')})">${ic('up')} Dieses Gerät hochladen</button>
     <p class="hint" style="margin:0">Überschreibt die Daten in der Cloud mit denen von diesem Gerät.</p></div>`)}
  catch(e){const pwErr=typeof e==='string'&&/Passwort/.test(e);if(!validated||pwErr){SY=prev;saveSY()}else{saveSY()}toast(typeof e==='string'?e:'Keine Verbindung zu GitHub möglich');}}

/* ---------- Start ---------- */
load(); if(syncOn()){initialPulled=false;bootTs=S._ts||0;setTimeout(finishBoot,4000)} if(S.salary.provHist['2026-10']==null)S.salary.provHist['2026-10']=0; if(!S.settings.appName||['Takt','Zeitwerk','ClosingTime'].includes(S.settings.appName))S.settings.appName='Sales Dashboard'; S.deals.forEach(d=>{if(d.name==='Übernahme aus Excel'){d.name='';if(d.date<(S.settings.startMonth||'2026-11'))d.retro=true}});S.leads.forEach(l=>{if(l.note==='Übernahme aus Excel')l.note=''});if(!S.settings.name)S.settings.name='Alexander'; if(!LOGOS[S.settings.logo])S.settings.logo='a'; if(!S.settings.theme)S.settings.theme='auto'; _rawSave(); applyTheme(); setTouchIcon(); route(); paintSync(); if(syncOn()){pullNow('boot');idbSet(SYNC_KEY,JSON.parse(JSON.stringify(SY)))}else{idbGet(SYNC_KEY).then(v=>{if(v&&v.token&&!syncOn()){SY=v;try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}initialPulled=false;bootTs=S._ts||0;setTimeout(finishBoot,4000);pullNow('boot');paintSync()}})} if(lockActive())showLock(); else setTimeout(()=>afterInitial(dailyFlow),500);
setInterval(()=>{if(!document.hidden&&VIEW==='home'&&!document.getElementById('sheet').classList.contains('on')&&document.activeElement.tagName!=='INPUT')render()},60000);
