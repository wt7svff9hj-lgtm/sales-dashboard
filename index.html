<style>
:root{color-scheme:light dark}*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;background:#EEF0F5;color:#0B0D14;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
@media(prefers-color-scheme:dark){body{background:#06070B;color:#F3F4F8}.gk-c{background:#12141C!important;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 60px -30px #000!important}.gk-i{background:#1B1E29!important;color:#F3F4F8!important;border-color:#2A2E3B!important}.gk-s,.gk-r{color:#8A90A2!important}}
.gk-c{width:100%;max-width:360px;background:#fff;border-radius:28px;padding:30px 24px 24px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 30px 60px -30px rgba(20,25,45,.35);text-align:center}
.gk-l{width:72px;height:72px;border-radius:20px;display:block;margin:0 auto 16px;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
.gk-h{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0}.gk-s{color:#6B7183;font-size:14px;margin:6px 0 20px}
.gk-i{width:100%;height:54px;border-radius:16px;border:1.5px solid #E3E6EE;background:#F6F7FA;color:#0B0D14;font-family:inherit;font-size:17px;font-weight:600;padding:0 16px;outline:none;-webkit-appearance:none}
.gk-i:focus{border-color:#F5C518;box-shadow:0 0 0 4px rgba(245,197,24,.25)}
.gk-b{margin-top:12px;width:100%;height:54px;border:0;border-radius:16px;background:#0B0D14;color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){.gk-b{background:#F5C518;color:#0B0D14}}
.gk-b:disabled{opacity:.6}.gk-r{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14px;color:#6B7183;user-select:none}
.gk-r input{width:20px;height:20px;accent-color:#F5C518;margin:0}.gk-e{color:#E11D48;font-size:14px;font-weight:600;min-height:20px;margin-top:10px}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#gk{display:none}#gk.on{display:block;width:100%;max-width:360px}
</style>
