.title h1,.sh h2,.big,.mid,.figs .v,.tile .tv,.tp-l,.wr-h,.wr-big,.kk-h,.lk-hi,.paybig,.mo-h,.mo-amt,.sheet h2,.dw,.ringw .rt b,.hfig b,.lv2 .lp,.rbox b,.pc-sum b,.kk-stats b,.wr-stats b,.mo-grid b,.tres b,.clock .time{font-family:'SD Display','SD Text',-apple-system,system-ui,sans-serif;letter-spacing:-.025em}
.big,.mid,.figs .v,.tile .tv,.ringw .rt b,.paybig,.hfig b,.pc-sum b,.num{font-variant-numeric:tabular-nums}
/* ---- Lebendige Zahlen & dezente Effekte ---- */
@keyframes growX{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes drawL{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes arcIn{from{stroke-dasharray:0 var(--C)}}
@keyframes sheen{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(260%) skewX(-18deg)}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.enter .rail .fl,.enter .wgb i,.enter .lb i,.enter .split i{animation:growX .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left center}
.enter .rarc{animation:arcIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.enter .pc-ist{stroke-dasharray:1;animation:drawL 1.1s .15s cubic-bezier(.4,0,.2,1) both}
.enter .pc-area{animation:fadein .8s .5s both}
.enter .bento>*,.enter .cols>*,.enter>.panel,.enter .weeks>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.enter .bento>*:nth-child(2){animation-delay:.04s}.enter .bento>*:nth-child(3){animation-delay:.08s}.enter .bento>*:nth-child(4){animation-delay:.12s}.enter .bento>*:nth-child(5){animation-delay:.16s}.enter .bento>*:nth-child(6){animation-delay:.2s}.enter .bento>*:nth-child(n+7){animation-delay:.24s}
.enter .cols>*:nth-child(2){animation-delay:.06s}
.daytile::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-120%) skewX(-18deg);pointer-events:none}
.enter .daytile::after{animation:sheen 1.4s .35s ease-in-out}
.tile,.panel,.li,.qa button,.ibtn,.chip,.addbtn{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background-color .2s}
a.tile:active,.chip:active,.ibtn:active,.addbtn:active{transform:scale(.96)}
@media (hover:hover){a.tile:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(15,18,30,.05),0 14px 34px rgba(15,18,30,.1)}}
.syncbar.ok .sd{animation:livePulse 2.4s infinite}
.syncbar b{font-weight:700;color:var(--ink)}
.tabs a{transition:color .2s,background-color .25s,transform .18s}.tabs a:active{transform:scale(.94)}

.pace{position:relative;margin-top:14px;touch-action:pan-y}.pace svg{display:block;width:100%;height:auto;overflow:visible}
:root{--pIst:#D9B300;--pGh:#8A7CF0}
html[data-theme="dark"]{--pIst:#F9DC4A;--pGh:#A99BFF}
.pc-ist{fill:none;stroke:var(--pIst);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.pc-dot{fill:var(--pIst);stroke:var(--paper);stroke-width:2}
.pc-soll{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 4}
.pc-ghost{fill:none;stroke:var(--pGh);stroke-width:1.6;opacity:.85}
.pc-grid{stroke:var(--hair);stroke-width:1}.pc-base{stroke:var(--hair2);stroke-width:1}
.pc-cross{stroke:var(--ink2);stroke-width:1;opacity:.5}
.pc-ax{font-size:10.5px;fill:var(--muted);font-weight:500}
.pc-tip{display:none;position:absolute;top:-6px;background:var(--paper);border:1px solid var(--hair2);border-radius:12px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);pointer-events:none;white-space:nowrap;z-index:3}
.pc-tip b{display:block;margin-bottom:3px}.pc-tip span{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.pc-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--ink2)}.pc-leg span{display:flex;align-items:center;gap:6px}
.pc-leg i,.pc-tip i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--pIst);border-radius:2px}
.pc-leg i.soll,.pc-tip i.soll{border-top:2px dashed var(--muted)}.pc-leg i.gh,.pc-tip i.gh{border-top-color:var(--pGh)}
.pc-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
.pc-sum b{display:block;font-size:19px;font-weight:700;font-stretch:var(--cond);margin-top:2px;font-variant-numeric:tabular-nums}.pc-sum small{font-size:11.5px;color:var(--muted)}
.card-prev{border-radius:20px;overflow:hidden;background:#0B0C10;aspect-ratio:9/16;max-height:62vh;margin:0 auto;display:flex;align-items:center;justify-content:center}
.card-prev img{width:100%;height:100%;object-fit:contain;display:block;-webkit-touch-callout:default}

.spx{display:inline-flex;align-items:center;gap:2px;font-style:normal;line-height:1}.spx s{text-decoration:none;opacity:.45;font-weight:600;font-size:.85em}.spx svg{width:14px;height:14px;flex:none}.cd .spx{font-size:13px;gap:1px}.cd span .spx{flex:none;overflow:visible}.cd span .spx svg{width:15px;height:15px;min-width:15px;flex:none}

html,body{margin:0;color:var(--ink);font-family:'SD Text',-apple-system,system-ui,sans-serif;font-feature-settings:'cv11','ss03';font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{background:var(--canvas);-webkit-user-select:none;user-select:none}
html[data-theme=dark] body{background:radial-gradient(900px 500px at 85% -10%,rgba(249,220,74,.08),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(249,220,74,.04),transparent 60%),var(--canvas)}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(var(--safeT) + 10px) 18px calc(var(--safeB) + 96px)}
.wrap{max-width:1240px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;height:44px}
.bar .sp{flex:1}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark .lg{width:32px;height:32px;border-radius:9px;overflow:hidden;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.mark .lg svg{display:block;width:100%;height:100%}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);flex:none}
.ibtn svg{width:19px;height:19px}
.ibtn.acc{background:var(--grad);color:#111318;box-shadow:0 6px 18px rgba(220,180,0,.35)}
.title{display:flex;align-items:flex-end;gap:10px;margin:16px 0 20px;flex-wrap:wrap}
.title h1{margin:0;font-size:42px;line-height:1;font-weight:700;font-stretch:var(--cond);letter-spacing:-.01em}
.title .sp{flex:1}
.month{display:inline-flex;align-items:center;background:var(--paper);border-radius:999px;height:40px;padding:0 4px;box-shadow:var(--shadow)}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.month button svg{width:17px;height:17px}
.month span{font-weight:600;font-size:15px;min-width:120px;text-align:center}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--hair);display:flex;padding:6px 8px calc(var(--safeB) + 6px)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;max-width:120px;margin:0 auto;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:20px;transition:color .2s,background .2s}
.tabs a svg{width:23px;height:23px}
.tabs a.on{color:#111318;background:var(--accFill)}

@media (min-width:1000px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:3px;width:240px;flex:none;padding:calc(var(--safeT) + 24px) 16px 24px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
  .side .mark{padding:0 10px 28px}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:15px;transition:background .15s,color .15s}
  .side a svg{width:20px;height:20px}
  .side a:hover{background:var(--paper);color:var(--ink)}
  .side a.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow),inset 3px 0 0 var(--accFill)}
  .side .grow{flex:1}
  .main{padding:calc(var(--safeT) + 24px) 36px 56px}
  .bar .mark{display:none}
  .title h1{font-size:48px}
}

/* ---------- Surfaces ---------- */
.panel{background:var(--paper);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.panel.flush{padding:4px 20px}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.cols.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.cols.half{grid-template-columns:1fr 1fr}}
@media (min-width:1280px){.cols.three{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}}
@media (min-width:760px) and (max-width:1279px){.cols.three{grid-template-columns:1fr 1fr}.cols.three>:first-child{grid-column:1/-1}}
.sh{display:flex;align-items:center;gap:10px;margin:28px 2px 12px}
.sh h2{margin:0;white-space:nowrap;font-size:21px;font-weight:700;letter-spacing:-.01em}
.sh .sp{flex:1}
.sh .meta{color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.lbl{font-size:13.5px;color:var(--muted);font-weight:500}
.big{font-size:46px;line-height:1;font-weight:650;font-stretch:var(--cond);font-variant-numeric:tabular-nums}
.mid{font-size:28px;line-height:1.05;font-weight:650;font-stretch:var(--cond);font-variant-numeric:tabular-nums}
.gt{color:var(--ink);background:linear-gradient(transparent 58%,#F9DC4A 58%,#F9DC4A 90%,transparent 90%);padding:0 .06em}
html[data-theme=dark] .gt{color:#F9DC4A;background:none}

.figs{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.figs>div{padding:4px 16px}
.figs>div:first-child{padding-left:0}
.figs>div+div{border-left:1px solid var(--hair)}
.figs .v{font-size:28px;font-weight:650;font-stretch:var(--cond);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.figs .s{font-size:12.5px;color:var(--muted);margin-top:2px}
@media (max-width:560px){.figs.wrap4{--n:2!important;row-gap:16px}.figs.wrap4>div:nth-child(3){padding-left:0;border-left:0}}

.li{display:flex;align-items:center;gap:13px;padding:14px 0;min-height:58px;cursor:pointer;text-decoration:none;color:inherit;border-radius:12px;transition:background .15s}
.li+.li{border-top:1px solid var(--hair)}
.li .ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accSoft);color:var(--acc);flex:none}
.li .ico svg{width:18px;height:18px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:15.5px}
.li .t small{display:block;color:var(--muted);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{text-align:right;font-weight:650;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .v small{display:block;font-size:12.5px;font-weight:500;color:var(--muted)}
.li .chev{color:var(--hair2);width:16px;height:16px;flex:none}

/* rail */
.rail{position:relative;margin:16px 0 28px}
.rail .tr{height:10px;border-radius:99px;background:var(--raise);overflow:hidden}
.rail .fl{height:100%;border-radius:99px;background:var(--grad);box-shadow:0 0 14px rgba(246,199,0,.45);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rail .fl.ok{background:linear-gradient(100deg,#12945A,#34D186);box-shadow:0 0 14px rgba(52,209,134,.4)}
.rail .g{position:absolute;top:-4px;width:2px;height:18px;background:var(--hair2);border-radius:2px}
.rail .g span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.rail .g.hit{background:var(--green)} .rail .g.hit span{color:var(--green)}
.rail.dark .tr{background:rgba(255,255,255,.14)} .rail.dark .g{background:rgba(255,255,255,.3)} .rail.dark .g span{color:rgba(255,255,255,.6)} .rail.dark .fl{background:var(--grad);box-shadow:0 0 16px rgba(249,220,74,.5)}

.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--raise);color:var(--ink2);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.g{background:var(--greenSoft);color:var(--green)} .chip.r{background:var(--redSoft);color:var(--red)} .chip.a{background:var(--amberSoft);color:var(--amber)} .chip.acc{background:var(--accSoft);color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:15px;font-weight:600;font-size:15.5px;background:var(--raise);color:var(--ink);transition:filter .15s,transform .1s}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--grad);color:#111318;box-shadow:0 8px 22px rgba(220,180,0,.35)}
.btn.white{background:#fff;color:#0A0B10}
.btn.danger{background:var(--redSoft);color:var(--red)}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.li:active,.day:active{opacity:.7}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}.li:hover{background:var(--hover);margin:0 -10px;padding-left:10px;padding-right:10px}.li:hover+.li{border-top-color:transparent}.day:hover{filter:brightness(.98)}html[data-theme=dark] .day:hover{filter:brightness(1.25)}.ibtn:hover,.month button:hover{color:var(--acc)}}
.row{display:flex;align-items:center;gap:10px}
.row .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.inp{width:100%;height:48px;padding:0 14px;border-radius:13px;border:1px solid var(--hair2);background:var(--raise);outline:none;font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none;transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--accLine);background:var(--paper)}
textarea.inp{height:auto;padding:12px 14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:38px;padding:0 13px;border-radius:12px;background:var(--raise);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--ink2);transition:all .15s}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--grad);color:#111318}
.seg.pill{display:inline-flex;background:var(--raise);padding:4px;border-radius:14px;gap:2px;flex-wrap:nowrap}
.seg.pill button{height:34px;background:none;border-radius:10px}
.seg.pill button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:34px;padding:0 12px;border-radius:10px;background:var(--raise);font-size:13.5px;font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid3.r{grid-template-columns:1fr 1fr}}

/* ---------- Hero (Stempeluhr, Ergebnis) ---------- */
.hero,.clock,.res,.tot{color:#fff;background:
  radial-gradient(90% 110% at 100% 0%,rgba(249,220,74,.30) 0%,transparent 55%),
  radial-gradient(70% 90% at 0% 100%,rgba(249,220,74,.12) 0%,transparent 60%),#121318;
  position:relative;overflow:hidden}
.clock{container-type:inline-size;border-radius:28px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.18)}

.hero>*,.clock>*,.res>*{position:relative;z-index:1}
.clock .top{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(255,255,255,.72);font-weight:500}
.clock .top .sp{flex:1}
.clock .top .st{display:inline-flex;align-items:center;gap:7px;color:#fff;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;font-weight:600;font-size:13px}
.clock .top .dot{width:8px;height:8px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 4px rgba(61,220,132,.25);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.clock .time{font-size:88px;line-height:.95;font-weight:600;font-stretch:var(--cond);margin:16px 0 6px;font-variant-numeric:tabular-nums;text-shadow:0 4px 30px rgba(0,0,0,.25)}
.clock .time.word{font-size:clamp(32px,15cqw,64px);white-space:nowrap}
.clock .time small{font-size:30px;color:rgba(255,255,255,.55);font-weight:500;margin-left:4px}
.clock .sub{color:rgba(255,255,255,.75);font-size:14.5px}
.clock .cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.clock .cell{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:10px 12px}
.clock .cell label{display:block;font-size:12.5px;color:rgba(255,255,255,.6);font-weight:500}
.clock .cell input{width:100%;min-width:0;background:transparent;border:0;color:#fff;font-size:22px;font-weight:600;font-stretch:var(--cond);outline:none;padding:2px 0 0;height:30px;-webkit-appearance:none;appearance:none;color-scheme:dark;font-variant-numeric:tabular-nums}
.clock .cell input::-webkit-calendar-picker-indicator{display:none}
.clock .cell input::placeholder{color:rgba(255,255,255,.4)}
.clock .acts{display:flex;gap:8px;margin-top:12px}
.clock .acts .btn{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.clock .acts .btn.white{background:#fff;color:#0A0B10;flex:1}
.res{border-radius:24px;padding:22px}
.res .lbl{color:rgba(255,255,255,.65)}
.tot{display:flex;align-items:flex-end;justify-content:space-between;border-radius:18px;padding:18px;margin-top:12px}
.tot span{color:rgba(255,255,255,.7);font-size:14px;font-weight:500}

/* ring */
.ringw{position:relative;width:132px;height:132px;flex:none}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringw .rt b{line-height:1;display:block}
.ringw .rt small{position:absolute;left:0;right:0;top:calc(50% + 24px);margin:0}
.ringw .rt b{font-size:30px;font-weight:650;font-stretch:var(--cond);line-height:1}
.ringw .rt small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}

/* week bars */
.wk{display:flex;gap:10px;align-items:flex-end;height:140px;position:relative;margin-top:6px}
.wk .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.wk .c i{display:block;width:100%;max-width:28px;border-radius:8px;background:var(--grad);min-height:4px;opacity:.9}
.wk .c i.off{background:var(--raise);opacity:1} .wk .c i.u{background:var(--u)}
.wk .c small{font-size:12px;color:var(--muted);font-weight:600}
.wk .c.today small{color:var(--ink);font-weight:700}
.wk .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--hair2)}

/* ---------- Days ---------- */
.weeks{display:block}
.weeks>div{break-inside:avoid;padding-top:1px}
@media (min-width:1180px){.weeks{columns:2;column-gap:18px}}
.wkh{display:flex;align-items:baseline;gap:8px;margin:22px 6px 8px;font-size:14px;color:var(--muted);font-weight:600}
.wkh .sp{flex:1}
.wkh b{color:var(--ink);font-weight:650}
.days{background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.day{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:12px 16px 12px 14px;position:relative;cursor:pointer;transition:filter .15s}
.day+.day{border-top:1px solid var(--hair)}
.day::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:transparent}
.day .dn{line-height:1.05;text-align:center}
.day .dn b{display:block;font-size:22px;font-weight:650;font-stretch:var(--cond);font-variant-numeric:tabular-nums}
.day .dn small{font-size:12px;color:var(--muted);font-weight:600}
.day .md{min-width:0}
.day .md b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .md b svg{width:15px;height:15px;flex:none}
.day .md small{display:block;font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .rv{text-align:right;font-variant-numeric:tabular-nums}
.day .rv b{display:block;font-weight:650;font-size:16px}
.day .rv small{font-size:12.5px;font-weight:600}
.day.slim{padding-top:7px;padding-bottom:7px;background:var(--slim)}
.day.slim .dn b{font-size:16px;color:var(--muted)}
.day.slim .dn small{display:none}
.day.slim .md b{font-weight:500;color:var(--muted);font-size:14px}
.day.arbeit::before{background:var(--accLine)}
.day.koeln{background:var(--kBg)} .day.koeln::before{background:var(--k)}
.day.urlaub{background:var(--uBg)} .day.urlaub::before{background:var(--u)}
.day.halb{background:var(--hBg)} .day.halb::before{background:var(--h)}
.day.krank{background:var(--sBg)} .day.krank::before{background:var(--s)}
.day.feiertag{background:var(--wBg)} .day.feiertag::before{background:var(--w)}
.day.missing::before{background:var(--red)}
.day.today .dn b{color:#111318;background:var(--grad);border-radius:11px;width:36px;height:36px;line-height:36px;margin:0 auto;box-shadow:0 4px 12px rgba(220,180,0,.35)}
.day.today .dn small{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* ---------- Umsatz ---------- */
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:3px;margin:12px 0}
.split i{display:block;height:100%;border-radius:99px}
.lv{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:11px 0;font-variant-numeric:tabular-nums}
.lv+.lv{border-top:1px solid var(--hair)}
.lv b{font-weight:650}
.lv span{font-weight:500}
.lv.hit b,.lv.hit span{color:var(--green)}
.lv.next{background:var(--amberSoft);margin:0 -12px;padding:11px 12px;border-radius:12px;border-top-color:transparent}
.lv.next+.lv{border-top-color:transparent}
.addbtn.stbtn{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red);box-shadow:none}
.deal .ico.st{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)} .deal .v.neg{color:var(--red)}
.deal .ico.in{background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in)} .deal .ico.out{background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.yr{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:12px}
.yr .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;position:relative;cursor:pointer}
.yr .c i{display:block;width:72%;border-radius:6px;background:var(--ink2);min-height:3px;opacity:.55}
.yr .c i.none{background:var(--raise);opacity:1}
.yr .c.cur i{background:var(--grad);opacity:1}
.yr .c .tg{position:absolute;left:6%;right:6%;border-top:2px solid var(--hair2)}
.yr .c small{font-size:11.5px;color:var(--muted);font-weight:600}
.yr .c.cur small{color:var(--ink);font-weight:700}
.empty{color:var(--muted);font-size:14.5px;text-align:center;padding:24px 8px}

/* ---------- Forecast ---------- */
.fr{display:grid;grid-template-columns:1fr 136px;gap:4px 12px;align-items:center;padding:13px 0}
.fr+.fr{border-top:1px solid var(--hair)}
.fr b{font-weight:600;font-size:15.5px}
.fr small{display:block;color:var(--muted);font-size:13px}
.fr .inp{text-align:right;height:44px}
.fr .w{grid-column:2;text-align:right;font-size:13px;color:var(--muted);font-weight:500}
.fr .fixed{text-align:right;font-weight:650;font-size:17px;font-variant-numeric:tabular-nums}
.grp{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 2px}
.grp:first-child{margin-top:4px}

/* ---------- Gehalt ---------- */
.cr{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 0}
.cr+.cr{border-top:1px solid var(--hair)}
.cr .n{font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.cr b{font-weight:600;font-size:15px}
.cr small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.cr .v{font-weight:650;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12.5px;color:var(--muted);text-align:left;padding:8px 4px;font-weight:600;border-bottom:1px solid var(--hair)}
.tbl td{padding:12px 4px;border-bottom:1px solid var(--hair);font-weight:500}
.tbl .r{text-align:right}
.tbl tr:last-child td{border-bottom:0;font-weight:650}
.tbl tr.click{cursor:pointer}

.rs-act{position:relative;margin-top:10px;display:flex;gap:8px}.rs-act button{border:0;border-radius:99px;padding:7px 13px;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:13px;font-weight:650;cursor:pointer}

.eod-ops span small{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-top:1px}.eod-ops b{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap;text-align:right}
.eod-ops b small{display:block;font-size:12px;color:#F9DC4A;font-weight:600}
.eod-sum span{color:#F9DC4A;font-weight:700}
.eod-btn{margin-top:12px}
.eod-tip{padding:7px 0;font-size:14.5px;line-height:1.4;color:rgba(255,255,255,.85)}
/* ---------- Motivation ---------- */
.streaks{display:flex;gap:8px;overflow-x:auto;margin:-6px -18px 16px;padding:0 18px 2px;scrollbar-width:none}
.streaks::-webkit-scrollbar{display:none}
.streaks>*{flex:none;display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:99px;background:var(--paper);box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.bento>.tempo,.bento>.mission,.bento>.dream,.bento>.friday{grid-column:1/-1}
@media (min-width:760px){.bento>.tempo,.bento>.mission,.bento>.dream,.bento>.friday{grid-column:span 2}}
.amp{display:flex;gap:6px;background:#111318;padding:6px 8px;border-radius:99px}
.amp i{width:12px;height:12px;border-radius:50%;background:#3A3D46}
.amp.red i:nth-child(1){background:#FF5C61;box-shadow:0 0 10px #FF5C61}
.amp.yellow i:nth-child(2){background:#F9DC4A;box-shadow:0 0 10px #F9DC4A}
.amp.green i:nth-child(3){background:#34D186;box-shadow:0 0 10px #34D186}
.tp-l{font-size:24px;font-weight:700;font-stretch:var(--cond);margin:10px 0 2px}
.tp-l.red{color:var(--red)}.tp-l.green{color:var(--green)}.tp-l.yellow{color:var(--amber)}
.wg{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.wgb{height:10px;border-radius:99px;background:var(--raise);overflow:hidden;margin-top:8px}
.wgb i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.mission .mi{display:flex;align-items:center;gap:12px;padding:11px 0;cursor:pointer;font-size:15px}
.mission .mi+.mi{border-top:1px solid var(--hair)}
.mission .mi input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--hair2);flex:none;margin:0;display:grid;place-items:center;transition:all .15s}
.mission .mi input:checked{background:var(--accFill);border-color:var(--accLine)}
.mission .mi input:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid #111318;border-bottom:2.5px solid #111318;transform:rotate(-45deg) translate(1px,-1px)}
.mission .mi.on span{text-decoration:line-through;color:var(--muted)}
.dream{border:0;width:100%;font:inherit;color:inherit;cursor:pointer;text-align:left}
.dream .chev{width:18px;height:18px;color:var(--muted);flex:none}
.dr-e{width:46px;height:46px;border-radius:14px;background:var(--accSoft);display:grid;place-items:center;font-size:24px;flex:none}
.friday{display:flex;gap:14px;align-items:center;background:var(--accFill)!important;color:#111318}
.friday .lbl{color:rgba(17,19,24,.7)}
.fr-emo{font-size:38px}
.fr-msg{font-weight:600;margin-top:4px}
.endspurt{margin-top:12px;background:repeating-linear-gradient(-45deg,#111318 0 12px,#1d1f26 12px 24px);color:#F9DC4A;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14.5px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:760px){.shelf{grid-template-columns:repeat(5,1fr)}}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--raise);text-align:center}
.bd span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--hair);color:var(--muted)}
.bd span svg{width:18px;height:18px}
.bd b{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.bd.on span{background:radial-gradient(circle at 35% 30%,#FFF3A6,#F9DC4A 55%,#E0B400);box-shadow:0 6px 16px rgba(220,180,0,.35)}
.bd.on b{color:var(--ink)}
.moment{z-index:88;display:none;align-items:center}
.moment.on{display:flex}
.mo-in{max-width:420px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;width:100%;padding:20px 0}
.mo-badge{font-size:84px;line-height:1;animation:bounce 1s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 10px 30px rgba(249,220,74,.45))}
.mo-kick{color:#F9DC4A;font-weight:700;font-size:15px;letter-spacing:.02em}
.mo-h{margin:0;font-size:40px;font-weight:700;font-stretch:var(--cond);line-height:1.05}
.mo-amt{font-size:64px;font-weight:700;font-stretch:var(--cond);line-height:1;font-variant-numeric:tabular-nums;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.mo-p{margin:0;color:rgba(255,255,255,.8);font-size:16px;line-height:1.45}.mo-p b{color:#fff}
.mo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:6px}
.mo-grid div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;text-align:left}
.mo-grid small{display:block;font-size:12px;color:rgba(255,255,255,.55)}.mo-grid b{display:block;font-size:24px;font-weight:650;font-stretch:var(--cond)}.mo-grid em{display:block;font-style:normal;font-size:12px;color:#4BE39A}
.mo-in .kk-bar{width:100%}
.mo-rec{background:rgba(249,220,74,.15);color:#F9DC4A;border-radius:12px;padding:10px 14px;font-weight:700}
.mo-in .kk-go{width:100%}
.wrapov{position:fixed;inset:0;z-index:89;display:none;background:#0B0C10;color:#fff}
.wrapov.on{display:block;animation:kin .45s cubic-bezier(.2,.8,.2,1)}.wrapov.out{animation:kout .35s ease forwards}
.wr-bars{position:absolute;top:calc(var(--safeT) + 10px);left:16px;right:60px;display:flex;gap:4px;z-index:3}
.wr-bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}.wr-bars i.d,.wr-bars i.a{background:#F9DC4A}
.wr-x{position:absolute;top:calc(var(--safeT) + 22px);right:14px;z-index:4}
.wr-tap{position:absolute;top:0;bottom:0;z-index:2}.wr-tap.l{left:0;width:35%}.wr-tap.r{right:0;width:65%}
.wr-s{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safeT) + 60px) 28px calc(var(--safeB) + 40px);max-width:520px;margin:0 auto;animation:fadein .35s ease}
.wr-s.y{background:#F9DC4A;color:#111318;max-width:none}
.wr-s.y>*{max-width:464px;width:100%;margin-left:auto;margin-right:auto}
.wr-s .kk-go{position:relative;z-index:5}
.wr-emo{font-size:72px;animation:bounce 1s cubic-bezier(.3,1.6,.5,1) both}
.wr-k{font-size:15px;font-weight:700;color:#F9DC4A;margin-top:10px}.wr-s.y .wr-k{color:rgba(17,19,24,.6)}
.wr-h{margin:6px 0 10px;font-size:58px;line-height:.95;font-weight:700;font-stretch:var(--cond)}
.wr-big{font-size:68px;line-height:1;font-weight:700;font-stretch:var(--cond);margin:8px 0 12px;font-variant-numeric:tabular-nums;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.wr-p{font-size:18px;line-height:1.45;margin:0 0 10px;color:inherit;opacity:.85}
.wr-chip{display:inline-flex;align-self:flex-start;padding:8px 14px;border-radius:99px;font-weight:700;background:rgba(255,255,255,.1)}
.wr-chip.up{color:#4BE39A}.wr-chip.down{color:#FF8A8D}
.wr-split{display:flex;gap:10px;flex-wrap:wrap}.wr-split span{background:rgba(255,255,255,.08);padding:8px 12px;border-radius:12px}
.wr-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.wr-stats div{background:rgba(255,255,255,.07);border-radius:18px;padding:16px}.wr-stats b{display:block;font-size:40px;font-weight:700;font-stretch:var(--cond)}.wr-stats small{color:rgba(255,255,255,.6)}
/* ---------- Performance ---------- */
.days,.panel,.tile,.daytile,.hero{contain:layout paint}
.weeks>div{content-visibility:auto;contain-intrinsic-size:auto 400px}
.sheet{will-change:transform}
.tabs a{transition:none}
.tabs a:active{transform:scale(.94)}
/* ---------- Saison ---------- */
.schip{background:rgba(17,19,24,.1);color:#111318;padding:3px 10px;border-radius:99px;font-weight:700}
.sfx{position:absolute;inset:0;pointer-events:none;z-index:0!important;overflow:hidden;border-radius:inherit}
.sfx.mark{display:flex;align-items:flex-end;justify-content:flex-end;font-size:120px;opacity:.12;padding:0 10px 0 0;line-height:1;transform:rotate(-12deg) translate(14px,22px)}
.sfx.snow i{position:absolute;top:-8px;border-radius:50%;background:#fff;opacity:.95;animation:snow linear infinite;box-shadow:0 0 0 1px rgba(17,19,24,.10),0 1px 3px rgba(17,19,24,.15)}
@keyframes snow{to{transform:translate(18px,320px)}}
.sfx.dots i{position:absolute;width:6px;height:6px;border-radius:2px;opacity:0;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.7;transform:scale(1.3) rotate(45deg)}}
.kk-season{align-self:flex-start;background:rgba(249,220,74,.14);color:#F9DC4A;padding:7px 12px;border-radius:99px;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){.sfx.snow,.sfx.dots{display:none}}
/* ---------- Sync ---------- */
.syncbar{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px 0 10px;margin:2px 0 0;border-radius:99px;background:var(--paper);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;color:var(--ink2);max-width:100%}
.syncbar svg{width:15px;height:15px;flex:none}
.syncbar span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncbar .sd{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.syncbar.ok .sd{background:var(--green)}.syncbar.ok svg{color:var(--green)}
.syncbar.busy .sd{background:var(--amber);animation:blink 1s infinite}.syncbar.busy svg{color:var(--amber)}
.syncbar.warn .sd{background:var(--amber)}.syncbar.err .sd{background:var(--red)}.syncbar.err{color:var(--red)}
.syncinfo{display:flex;gap:12px;align-items:center;background:var(--raise);border-radius:16px;padding:14px}
.syncinfo svg{width:26px;height:26px;flex:none;color:var(--muted)}.syncinfo.ok svg{color:var(--green)}.syncinfo.error svg{color:var(--red)}
.syncinfo b{font-weight:650}
/* ---------- Sheet, toast, tip ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);border-radius:28px 28px 0 0;padding:8px 20px calc(var(--safeB) + 20px);max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--hair2);margin:0 auto 14px}
.sheet h2{margin:0 0 16px;font-size:26px;font-weight:700;font-stretch:var(--cond);display:flex;align-items:center;gap:10px}
.sheet h2 .sp{flex:1}
.sheet h2 .ibtn{background:var(--raise);box-shadow:none}
@media (min-width:700px){.sheet{left:50%;right:auto;width:540px;bottom:auto;top:50%;border-radius:28px;transform:translate(-50%,-47%) scale(.98);opacity:0;pointer-events:none;transition:all .22s;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.3)}.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}.sheet .grab{display:none}}

.tip.on{opacity:1}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.logos button{border-radius:20px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:14px;background:var(--raise);border:2px solid transparent}
.logos button.on{border-color:var(--accLine)}
.logos .lg{width:76px;height:76px;border-radius:19px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.logos .lg svg{display:block;width:100%;height:100%}
.warn{display:flex;align-items:center;gap:8px;background:var(--redSoft);color:var(--red);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}
.warn svg{width:18px;height:18px;flex:none}
.fade{animation:fade .2s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#print{display:none}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;font-size:11px;color:#000;background:#fff}#print table{width:100%;border-collapse:collapse}#print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left}}

/* ============================================================
   QUOTA – Arbeitszeit, Umsatz, Forecast, Gehalt, Verlauf
   Eine Datei. Daten im localStorage (Schlüssel: quota_v1).
   ============================================================ */
const LS_KEY='quota_v1';
const APP_VERSION='112';const APP_SEMVER='3.10.5';const APP_DATE='2026-11-12';
const verTxt=()=>{const d=pD(APP_DATE);return `Version ${APP_SEMVER} vom ${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`};
/* ---------- Auto-Update: prüft beim Öffnen, ob eine neuere Version online ist ---------- */
let UPD_BUSY=false;
async function checkUpdate(manual){
  if(!/^https?:/.test(location.protocol)){if(manual)toast('Update-Prüfung nur online');return}
  if(UPD_BUSY||!navigator.onLine){if(manual&&!navigator.onLine)toast('Keine Verbindung');return}
  UPD_BUSY=true;
  try{
    const r=await fetch(location.pathname+'?u='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
    const tx=await r.text();const m=tx.match(/const APP_VERSION='(\d+)'/);const nv=m?+m[1]:0;const sv=(tx.match(/const APP_SEMVER='([\d.]+)'/)||[])[1]||nv;
    if(nv>+APP_VERSION){
      let tries=0;try{tries=+(sessionStorage.getItem('upd_'+nv)||0);sessionStorage.setItem('upd_'+nv,tries+1)}catch(e){}
      if(tries>=2){if(manual)toast('Version '+sv+' ist online, kommt gleich an');return}
      if(typeof dirty!=='undefined'&&dirty){try{clearTimeout(pushTimer);await pushNow()}catch(e){}}
      toast('Update auf Version '+sv+' …');
      setTimeout(()=>location.replace(location.pathname+'?v='+nv+location.hash),800);
    }else if(manual)toast('Du hast die neueste Version ('+APP_SEMVER+')');
  }catch(e){if(manual)toast('Update-Prüfung fehlgeschlagen')}
  finally{UPD_BUSY=false}
}
setTimeout(()=>checkUpdate(false),1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>checkUpdate(false),600)});

function itemSheet(m,st,i){const x=((S.forecast[m]||{}).items||{})[st]?.[i];if(!x)return;IE={m,st,i};IST=st;IMO=m;ISRC=x.src||(x.opp&&oppFind(x.opp)?oppFind(x.opp).o.src:null)||null;const cm=ymOf(new Date());const ms=[0,1,2,3,4,5].map(d=>addM(cm,d));if(!ms.includes(m))ms.unshift(m);

function itemDel(){const {m,st,i}=IE;const F=S.forecast[m];const x=F.items[st].splice(i,1)[0];fcRecalc(F,st);if(x&&x.opp){const f=oppFind(x.opp);if(f){delete f.o.stage}}save();closeSheet();render();toast(`${x&&x.n||'Eintrag'} gelöscht`,'ok')}

    toast(`${x.n||'Opp'} → ${FCN[tst]}${tm!==m?' · '+MON[pD(tm).getMonth()]:''}`,'ok')}else fcRecalc(F,st);save();closeSheet();render()}
function fcItemStage(m,st,i,ns){if(ns===st)return;const F=S.forecast[m];if(!F||!F.items||!F.items[st]||!F.items[st][i])return;const x=F.items[st].splice(i,1)[0];fcRecalc(F,st);const _ds=x.since;x.since=todayK();x.sh=[...new Set([...(x.sh||[st]),ns])];trLog(st,ns,_ds);
  let it=F.items[ns];if(!it||!it.length){it=[];if(+F[ns])it.push({v:+F[ns],n:'Bisheriger Wert'})}it.push(x);F.items[ns]=it;fcRecalc(F,ns);
  if(x.opp){const f=oppFind(x.opp);if(f){f.o.stage=ns;f.o.stageSince=todayK()}}save();render();toast(`${x.n||'Opp'} → ${FCN[ns]}`,'ok')}
function fcRecalc(F,st){const it=F.items[st]||[];F[st]=it.reduce((a,y)=>a+(+y.v||0),0);if(!it.length)delete F.items[st]}
/* ---------- Closed Won / Closed Lost protokollieren + Motivations-Effekt ---------- */
function closedLog(res,x,m,st){S.closed=S.closed||[];const e={id:uid(),res,date:todayK(),m,n:x.n||x.name||'Opp',v:+x.v||+x.amount||0,st:st||x.stage||'',opp:x.opp||x.id||null,iid:x.iid||null,...(x.v!=null&&x.n!=null?{item:{...x}}:{}),...(x.cur?{cur:x.cur,orig:x.orig}:{})};S.closed.push(e);return e}
function closedStats(){const c=S.closed||[];const won=c.filter(x=>x.res==='won').length,lost=c.filter(x=>x.res==='lost').length;const cm=ymOf(new Date());const lm=c.filter(x=>x.res==='lost'&&x.date.slice(0,7)===cm);
  const reasons={};c.filter(x=>x.res==='lost'&&x.reason).forEach(x=>reasons[x.reason]=(reasons[x.reason]||0)+1);
  return {won,lost,rate:won+lost?won/(won+lost)*100:null,lostM:lm.length,lostMV:lm.reduce((a,x)=>a+x.v,0),reasons:Object.entries(reasons).sort((a,b)=>b[1]-a[1])}}
const LOST_REASONS=['Preis','Timing','Wettbewerb','Kein Bedarf','Kein Budget','Kein Kontakt mehr','Entscheider fehlt','Sonstiges'];

function fcItemAct(m,st,i,act,ok){const F=S.forecast[m];if(!F||!F.items||!F.items[st]||!F.items[st][i])return;if((act==='won'||act==='lost')&&!ok){oppConfirm({...F.items[st][i],st},act,()=>fcItemAct(m,st,i,act,true));return}const x=F.items[st].splice(i,1)[0];fcRecalc(F,st);const f=x.opp?oppFind(x.opp):null;
  if(act==='push'||act==='pull'){const nm=act==='pull'?ymOf(new Date()):addM(m,1);S.forecast[nm]=S.forecast[nm]||{};const N=S.forecast[nm];N.items=N.items||{};let it=N.items[st];if(!it||!it.length){it=[];if(+N[st])it.push({v:+N[st],n:'Bisheriger Wert'})}it.push(x);N.items[st]=it;fcRecalc(N,st);if(f)f.o.fm=nm;save();render();toast(act==='pull'?`${x.n||'Opp'} zurück in den ${MON[pD(nm).getMonth()]} geholt`:`${x.n||'Opp'} → ${MON[pD(nm).getMonth()]} verschoben`,act==='pull'?'ok':'ok');return}

function oppConfirm(x,act,go){const won=act==='won';

function oppReopenSheet(id){const e=(S.closed||[]).find(x=>x.id===id);if(!e)return;const d=e.res==='won'?closedDeal(e):null;const st=e.st&&ST_ORDER.includes(e.st)?e.st:'expected';const cm=ymOf(new Date());const tm=(e.m||cm)<cm?cm:(e.m||cm);

function oppReopen(id){const ix=(S.closed||[]).findIndex(x=>x.id===id);if(ix<0)return;const e=S.closed[ix];const st=e.st&&ST_ORDER.includes(e.st)?e.st:'expected';const cm=ymOf(new Date());const tm=(e.m||cm)<cm?cm:(e.m||cm);

function oppAction(act){const f=oppFind(OPID);if(!f)return;const m=f.o.fm||f.k.slice(0,7);const F=S.forecast[m];let st=null,i=-1;if(F&&F.items)Object.keys(F.items).some(k=>{const j=F.items[k].findIndex(x=>x.opp===OPID);if(j>=0){st=k;i=j;return true}});closeSheet();

function pzCommit(el){const c=calcEval(el.value);if(c==null)return;const terms=String(el.value).replace(/=+$/,'').split('+').map(x=>Math.round(numIn(x))).filter(Boolean);ED.e.pause=Math.max(0,Math.round(c));ED.e.pauses=!/-|−/.test(el.value)&&terms.length>1?terms:null;el.value=ED.e.pause;pzInfo();updDay()}

function csvMonth(m){

  st.days.forEach(x=>{const e=x.e||{};const art=e.type?TYPES[e.type].l:(x.hol?'Feiertag: '+x.hol:x.weekend?'Wochenende':'');
    rows.push([dLabel(x.k),WDL[x.wd],art,e.start||'',e.end||'',isFree(e.type)?'':(e.pause??''),x.w!=null?hm(x.w):'',x.w!=null?fmtN(x.w,2):'',x.counted||x.soll?fmtN(x.soll,2):'',x.counted?fmtN(x.ist-x.soll,2):'',e.note||''])});
  rows.push([]);rows.push(['Summe','','','','','',hm(st.ist),fmtN(st.ist,2),fmtN(st.soll,2),fmtN(st.saldo,2)]);
  if(carry!=null){rows.push(['Übertrag Vormonat','','','','','','','','',fmtN(carry,2)]);rows.push(['Stundenkonto Monatsende','','','','','','','','',fmtN(carry+st.saldo,2)])}
  return '﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c}).join(';')).join('\n');
}

function salaryDeals(m,deals){const b=S.deals;S.deals=deals;try{return salary(m)}finally{S.deals=b}}

function calcEval(str){let t=String(str||'').replace(/[\s€]/g,'').replace(/−/g,'-').replace(/=+$/,'');if(!t)return null;const body=t.replace(/^[-+]/,'');if(!/[+\-]/.test(body))return null;const terms=t.match(/[+-]?[^+-]+/g);if(!terms)return null;let sum=0;for(const x of terms){const sg=x[0]==='-'?-1:1;const n=numIn(x.replace(/^[+-]/,''));sum+=sg*n}return Math.round(sum*100)/100}

  :`<div class="fcw"><button class="fcl" onclick="fcList('${f}')" aria-label="Einzelwerte eintragen" tabindex="-1">${ic('list')}</button><input class="inp num fcf" id="fc-${f}" inputmode="decimal" enterkeyhint="next" value="${val?fmtE(val,2):''}" placeholder="0,00 €" onfocus="this.value=this.value?(+numIn(this.value)).toLocaleString('de-DE',{maximumFractionDigits:2}):'';try{this.select()}catch(e){}" onblur="const el=this;setTimeout(()=>{if(el.isConnected&&document.activeElement!==el&&el.value&&calcEval(el.value)==null)el.value=fmtE(numIn(el.value),2)},0)" onchange="fcSet('${f}',this.value)" oninput="fcLive(this,'${f}')" onkeydown="fcKey(event,this,'${f}')"></div><div class="fcc" id="fcc-${f}"></div>`}

/* ============================================================
   Forecast abgeben (Montag) + Veränderung seit Abgabe
   ============================================================ */
function fcRates(F){const P=S.fcParams;return {signed:(P.signedRate!=null?+P.signedRate:90)/100,offer:(F?F.oR:(P.offerRate!=null?+P.offerRate:5))/100,proposal:+P.proposalRate/100,expected:+P.expectedRate/100}}
function itemKey(x,st){return x.opp?'o:'+x.opp:(x.iid?'i:'+x.iid:null)}
function ensureIids(m){const F=S.forecast[m];let ch=false;if(F&&F.items)Object.keys(F.items).forEach(st=>F.items[st].forEach(x=>{if(!x.opp&&!x.iid){x.iid=uid();ch=true}}));return ch}
function fcSnapshot(m){ensureIids(m);const F=forecast(m);const f=S.forecast[m]||{};const items=[];['signed','offer','proposal','expected'].forEach(st=>((f.items||{})[st]||[]).forEach(x=>items.push({k:itemKey(x,st),n:x.n||'Opp',st,v:+x.v||0})));
  const bare={};['signed','offer','proposal','expected'].forEach(st=>{if(!((f.items||{})[st]||[]).length)bare[st]=+f[st]||0});
  return {ts:Date.now(),date:todayK(),m,exp:F.exp,pct:F.pct,target:F.target,closed:F.closed,wN:F.wN,weeks:F.weeks,signed:F.signed,offer:F.offer,proposal:F.proposal,expected:F.expected,wO:F.wO,wP:F.wP,wE:F.wE,items,bare,deals:rev(m).ds.filter(d=>!d.retro).map(d=>d.id)}}
function kwOf(k){const d=pD(k);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7)}
function fcDue(){const m=ymOf(new Date());const sw=subThisWeek();return !(sw&&sw.m===m)}
function weekStart(k){const d=pD(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function prevSub(m){const ws=weekStart(todayK());const L=(S.fcSubs||[]).filter(x=>x.m===m&&x.date<ws);return L.length?L[L.length-1]:null}
function lastSub(m){const L=(S.fcSubs||[]).filter(x=>x.m===m);return L.length?L[L.length-1]:null}
function subThisWeek(){const ws=weekStart(todayK());return (S.fcSubs||[]).filter(x=>x.date>=ws).slice(-1)[0]||null}
function fcSubmit(){const m=ymOf(new Date());S.fcSubs=S.fcSubs||[];const ws=weekStart(todayK());S.fcSubs=S.fcSubs.filter(x=>!(x.m===m&&x.date>=ws));const snap=fcSnapshot(m);S.fcSubs.push(snap);if(S.fcSubs.length>80)S.fcSubs=S.fcSubs.slice(-80);save();closeSheet();render();toast(`✓ Forecast abgegeben: ${fmtE(snap.exp)} eingefroren`,'ok')}
function fcUnsubmit(){const s=subThisWeek();if(!s)return;S.fcSubs=S.fcSubs.filter(x=>x!==s);save();closeSheet();render();toast('Abgabe zurückgenommen')}
/* Unterschiede mit Gründen, gewichtet, Summe = Differenz */
function fcDiff(m,base){const now=fcSnapshot(m);const R=fcRates(forecast(m));const out=[];const add=(icon,txt,delta,cls)=>{if(Math.abs(delta)>=.5||cls==='info')out.push({icon,txt,delta,cls})};
  // Closed Won
  const newDeals=rev(m).ds.filter(d=>!d.retro&&!base.deals.includes(d.id));newDeals.forEach(d=>add(d.storno?'↩︎':'💰',d.storno?`Storno ${pn(d.name||'')}`:`Abschluss ${pn(d.name||'Deal')}`,+d.amount,d.storno?'neg':'pos'));
  const goneDeals=base.deals.filter(id=>!rev(m).ds.some(d=>d.id===id)).length;
  let accClosed=newDeals.reduce((a,d)=>a+ +d.amount,0);if(Math.abs(now.closed-base.closed-accClosed)>=.5)add('💰','Closed Won geändert',now.closed-base.closed-accClosed);
  // Items
  const bm=new Map(base.items.filter(x=>x.k).map(x=>[x.k,x])),nm=new Map(now.items.filter(x=>x.k).map(x=>[x.k,x]));const closedAfter=(S.closed||[]).filter(c=>c.date>=base.date);
  bm.forEach((b,k)=>{const n=nm.get(k);const wb=b.v*R[b.st];if(!n){const id=k.slice(2);const c=closedAfter.find(c=>c.opp===id||c.iid===id||(!c.opp&&c.n===b.n&&Math.round(c.v)===Math.round(b.v)));
      const nextHas=(()=>{const F2=S.forecast[addM(m,1)];return F2&&F2.items&&Object.values(F2.items).some(a=>a.some(x=>itemKey(x)===k))})();
      if(c&&c.res==='lost')add('✕',`Closed Lost: ${pn(b.n)} (${fmtE(b.v)}${c.reason?', '+c.reason:''})`,-wb,'neg');
      else if(c&&c.res==='won')add('✓',`Gewonnen: ${pn(b.n)}, zählt jetzt als Closed Won`,-wb,'info2');
      else if(nextHas)add('→',`Verschoben in den ${MON[pD(addM(m,1)).getMonth()]}: ${privOn()?'':pn(b.n)+' '}(${fmtE(b.v)}, ${FCN[b.st]})`,-wb,'neg');
      else add('−',`Entfernt: ${pn(b.n)} (${FCN[b.st]})`,-wb,'neg');return}
    if(n.st!==b.st)add(R[n.st]>R[b.st]?'↗':'↘',`${pn(n.n)}: ${FCN[b.st]} → ${FCN[n.st]}`,n.v*R[n.st]-wb,R[n.st]>R[b.st]?'pos':'neg');
    else if(Math.abs(n.v-b.v)>=.5)add('±',`${pn(n.n)}: Wert ${fmtE(b.v)} → ${fmtE(n.v)}`,(n.v-b.v)*R[n.st],n.v>b.v?'pos':'neg')});
  const fresh=[...nm.values()].filter(n=>!bm.has(n.k)&&!(n.n==='Bisheriger Wert'));
  if(fresh.length){const tot=fresh.reduce((a,n)=>a+n.v*R[n.st],0);add('＋',`Neu: ${fresh.length} ${fresh.length===1?'Opp':'Opps'} (${fresh.map(n=>(privOn()?'':pn(n.n)+' ')+fmtE(n.v)).join(', ')})`,tot,'pos')}
  // bare stage values
  ['signed','offer','proposal','expected'].forEach(st=>{if(base.bare[st]!=null&&now.bare[st]!=null&&Math.abs(now.bare[st]-base.bare[st])>=.5)add('±',`${FCN[st]} manuell geändert`,(now.bare[st]-base.bare[st])*R[st],now.bare[st]>base.bare[st]?'pos':'neg')});
  if(Math.abs(now.wN-base.wN)>=.5)add('⏱',`Pauschale neue Opps: ${fmtN(base.weeks,1)} → ${fmtN(now.weeks,1)} Restwochen`,now.wN-base.wN,now.wN>base.wN?'pos':'neg');
  const total=now.exp-base.exp;const acc=out.reduce((a,x)=>a+(x.delta||0),0);if(Math.abs(total-acc)>=1)add('…','Sonstiges (z. B. geänderte Gewichtung)',total-acc,'');
  return {now,base,total,rows:out}}
function sgnE(v){return (v>=0?'+':'−')+fmtE(Math.abs(v))}
function diffRowsHtml(d){return d.rows.length?`<div class="fd-rows">${d.rows.map(r=>`<div class="fd-r ${r.cls==='pos'?'fp':r.cls==='neg'?'fn':r.cls||''}"><i>${r.icon}</i><span>${r.txt}</span><b class="num">${r.cls==='info2'?'±0 €':sgnE(r.delta)}</b></div>`).join('')}</div>`:'<p class="lbl" style="margin:8px 0 0">Keine Veränderung seit der Abgabe.</p>'}
function fcReportText(m){const F=forecast(m);const cur=MON[pD(m).getMonth()];const wl=F.target?`${fmtN(F.pct,0)} % vom Ziel ${fmtE(F.target)}`:'';
  const pipe=F.wO+F.wP+F.wE+F.wN;let t=`Forecast ${cur} (Stand ${dLabel(todayK())}): ${fmtE(F.exp)}${wl?' ('+wl+')':''}.\nClosed Won ${fmtE(F.closed)} · Signed ${fmtE(F.signed)} · gewichtete Pipeline ${fmtE(pipe)}.`;
  const pb=prevSub(m);if(pb){const base=pb;const d=fcDiff(m,base);t+=`\nVeränderung zur letzten Abgabe (${dLabel(base.date)}): ${sgnE(d.total)}.`;const top=d.rows.filter(r=>r.cls!=='info2'&&Math.abs(r.delta)>=1).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,5);if(top.length)t+=`\nGründe: ${top.map(r=>r.txt.replace(/<[^>]+>/g,'')+' ('+sgnE(r.delta)+')').join('; ')}.`}
  return t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")}
async function fcCopy(){const m=ymOf(new Date());const t=fcReportText(m);try{await navigator.clipboard.writeText(t);toast('Text kopiert, jetzt in Teams einfügen','ok')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Text kopiert','ok')}catch(_){toast('Kopieren nicht möglich')}ta.remove()}}
function fcShare(){const t=fcReportText(ymOf(new Date()));if(navigator.share)navigator.share({text:t}).catch(()=>{});else fcCopy()}
function weekCard(m){if(m!==ymOf(new Date()))return '';const tk=todayK(),mon=pD(tk).getDay()===1;const sw=subThisWeek();const base=lastSub(m);
  const kw=kwOf(tk);
  if(sw&&sw.m===m){const d=fcDiff(m,sw);const t=new Date(sw.ts);const ch=Math.abs(d.total)>=1;return `<button class="wk-st ok" onclick="fcSubSheet()"><span class="wk-ic">${ic('check')}</span><span class="wk-tx"><b>Forecast KW ${kw} abgegeben</b><small>${WD2[t.getDay()]}, ${t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr · ${fmtE(sw.exp)}</small></span><span class="wk-rt ${ch?(d.total>0?'up':'dn'):''}">${ch?'seitdem<br><b class="num">'+sgnE(d.total)+'</b>':'unverändert'}</span>${ic('right')}</button>`}
  const d=base?fcDiff(m,base):null;
  if(!mon){const over=pD(tk).getDay()>1||pD(tk).getDay()===0;return `<button class="wk-st due ${over?'late':''}" onclick="fcSubSheet()"><span class="wk-ic">${ic('clock')}</span><span class="wk-tx"><b>Forecast KW ${kw} noch nicht abgegeben</b><small>${base?`Letzte Abgabe ${dLabel(base.date)} · ${fmtE(base.exp)}${d&&Math.abs(d.total)>=1?' · seitdem '+sgnE(d.total):''}`:'Noch keine Abgabe in diesem Monat'}</small></span><span class="wk-go">Abgeben</span></button>`}
  const late=new Date().getHours()>=12;
  return `<div class="panel wk-card"><div class="row"><div class="ptl">📮 Wochen-Forecast</div><span class="sp"></span><span class="chip sm ${late?'late':''}">${late?'Abgabe überfällig':'bis 12:00 Uhr'}</span></div>
    ${base?`<div class="wk-cmp"><div><small>Letzte Abgabe ${dLabel(base.date)}</small><b class="num">${fmtE(base.exp)}</b></div><div class="wk-ar">→</div><div><small>Heute</small><b class="num">${fmtE(d.now.exp)}</b></div><div class="wk-d ${d.total>=0?'pos':'neg'}"><b class="num">${sgnE(d.total)}</b></div></div>${diffRowsHtml(d)}`:'<p class="lbl" style="margin:6px 0 0">Dein erster abgegebener Forecast. Ab nächster Woche zeigt die App hier, was sich verändert hat und warum.</p>'}
    <div class="wk-btns"><button class="btn" onclick="fcCopy()">${ic('copy')}Text kopieren</button><button class="btn pri" onclick="fcSubmit()">${ic('check')}Abgegeben</button></div></div>`}
function fcSubSheet(){const m=ymOf(new Date());const sw=subThisWeek();const base=sw&&sw.m===m?sw:lastSub(m);const d=base?fcDiff(m,base):null;const hist=(S.fcSubs||[]).filter(x=>x.m===m).slice().reverse();
  openSheet(`${sheetHead('Forecast-Abgabe')}
   <div class="wk-sh ${sw?'ok':'due'}">${sw?ic('check'):ic('clock')}<span>${sw?`KW ${kwOf(todayK())} abgegeben am ${dLabel(sw.date)}, ${new Date(sw.ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr`:`KW ${kwOf(todayK())} noch nicht abgegeben`}</span></div>
   ${base?`<div class="wk-cmp"><div><small>${sw?'Abgegeben':'Letzte Abgabe'} ${dLabel(base.date)}</small><b class="num">${fmtE(base.exp)}</b></div><div class="wk-ar">→</div><div><small>Jetzt</small><b class="num">${fmtE(d.now.exp)}</b></div><div class="wk-d ${d.total>=0?'pos':'neg'}"><b class="num">${sgnE(d.total)}</b></div></div>
   <div class="fd-h">Was sich seitdem verändert hat</div>${diffRowsHtml(d)}`:'<p class="hint">Noch kein Forecast für diesen Monat abgegeben. Mit „Abgegeben“ friert die App den aktuellen Stand ein und vergleicht ab dann.</p>'}
   <button class="btn pri block wk-main" onclick="fcSubmit()">${ic('check')}${sw?'Aktuellen Stand neu abgeben':'Forecast KW '+kwOf(todayK())+' abgeben'}</button>
   <div class="wk-sec"><button onclick="fcCopy()">${ic('copy')}<span>Text kopieren</span></button>${navigator.share?`<button onclick="fcShare()">${ic('share')}<span>Teilen</span></button>`:''}${sw?`<button onclick="fcUnsubmit()">${ic('storno')}<span>Zurücknehmen</span></button>`:''}</div>
   ${hist.length?`<div class="fd-h" style="margin-top:18px">Abgaben im ${MON[pD(m).getMonth()]}</div><div class="list">${hist.map(h=>`<div class="li"><div class="t"><b>${dLabel(h.date)}</b><small>${new Date(h.ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</small></div><div class="v">${fmtE(h.exp)}<small class="mut" style="display:block;text-align:right;font-size:11.5px">${fmtN(h.pct,0)} %</small></div></div>`).join('')}</div>`:''}`)}

function subCur(v,ids){let c;try{c=localStorage.getItem('sub_'+v)}catch(e){}return ids.includes(c)?c:ids[0]}
function subSet(v,id){try{localStorage.setItem('sub_'+v,id)}catch(e){}render();const t=document.querySelector('.subtabs');if(t&&t.getBoundingClientRect().top<0)window.scrollTo({top:Math.max(0,scrollY+t.getBoundingClientRect().top-70),behavior:'smooth'})}
function subBar(v,items,cur){return `<div class="subtabs">${items.map(([id,l,n])=>`<button class="${cur===id?'on':''}" onclick="subSet('${v}','${id}')">${l}${n?`<em>${n}</em>`:''}</button>`).join('')}</div>`}

const ST_ORDER=['offer','proposal','expected','signed'];

const ST_SHORT={offer:'Offer',proposal:'Proposal',expected:'Expected',signed:'Signed'};
function stRate(st){const P=S.fcParams;return {offer:P.offerRate!=null?+P.offerRate:5,proposal:+P.proposalRate,expected:+P.expectedRate,signed:P.signedRate!=null?+P.signedRate:90}[st]||0}
function fcItemMoveTo(m,st,i,nm){if(nm===m)return;const F=S.forecast[m];if(!F||!F.items||!F.items[st]||!F.items[st][i])return;const x=F.items[st].splice(i,1)[0];fcRecalc(F,st);
  S.forecast[nm]=S.forecast[nm]||{};const N=S.forecast[nm];N.items=N.items||{};let it=N.items[st];if(!it||!it.length){it=[];if(+N[st])it.push({v:+N[st],n:'Bisheriger Wert'})}it.push(x);N.items[st]=it;fcRecalc(N,st);
  const f=x.opp?oppFind(x.opp):null;if(f)f.o.fm=nm;save();closeSheet();render();
  toast(nm===ymOf(new Date())?`🎯 ${x.n||'Opp'} zurück in den ${MON[pD(nm).getMonth()]}`:`📅 ${x.n||'Opp'} → ${MON[pD(nm).getMonth()]} ${pD(nm).getFullYear()}`,'ok')}
function oppMonthSheet(m,st,i){const x=((S.forecast[m]||{}).items||{})[st]?.[i];if(!x)return;const cm=ymOf(new Date());const ms=[0,1,2,3,4,5].map(d=>addM(cm,d));

function oppCard(m,x){const cm=ymOf(new Date());const open=`itemSheet('${m}','${x.st}',${x.i})`;const si=ST_ORDER.indexOf(x.st);

function oppGroups(m,items){return [...ST_ORDER].reverse().map(st=>{const it=items.filter(x=>x.st===st);if(!it.length)return '';const sum=it.reduce((a,x)=>a+(+x.v||0),0);

function vOpps(){const cm=ymOf(new Date());const OT=subCur('opps',['now','later','closed']);

    <div class="oh-figs"><div><small>Erwartung</small><b>${fmtN(fc.pct)} %</b></div><div><small>Später</small><b>${fmtE(tot-totNow)}</b></div><div><small>Gewinnquote</small><b>${cs.rate!=null?fmtN(cs.rate,0)+' %':'–'}</b></div></div>

const dDiff=(a,b)=>Math.round((pD(b)-pD(a))/864e5);

function insWin(days){const out=[];const d=new Date();for(let i=0;i<days;i++){out.push(ymd(d));d.setDate(d.getDate()-1)}return out}
function realDeals(){return S.deals.filter(d=>!d.retro&&!d.storno&&+d.amount>0)}
function insBase(){let ks=insWin(90).filter(k=>k<=todayK());const tr=ks.filter(k=>{const e=S.days[k];return e&&!isFree(e.type)&&worked(e)!=null});const from=tr.length?tr[tr.length-1]:ks[ks.length-1];ks=ks.filter(k=>k>=from);let h=0,wd=0,demo=0,ops=0,opVal=0;
  ks.forEach(k=>{const e=S.days[k];const w=e&&!isFree(e.type)?worked(e):null;if(w!=null){h+=w;wd++}const a=actOf(k);demo+=a.demo;ops+=a.ops.length;opVal+=a.ops.reduce((s,o)=>s+(+o.amount||0),0)});
  const weeks=Math.max(1,dDiff(from,todayK())/7);const dl=realDeals().filter(d=>d.date>=from);const rv=revSum(from,todayK());
  const cl=(S.closed||[]).filter(e=>e.date>=from);const won=cl.filter(e=>e.res==='won').length,lost=cl.length-won;
  const allCl=S.closed||[];const wonA=allCl.filter(e=>e.res==='won').length;
  return{h,wd,demo,ops,opVal,deals:dl.length,rv,won,lost,winRate:(()=>{const c=closedStats();return c.won+c.lost>=5?c.won/(c.won+c.lost):null})(),from,weeks}}
function insDealSize(){const L=realDeals();if(!L.length)return null;const cm=ymOf(new Date());const ms=[5,4,3,2,1,0].map(d=>addM(cm,-d));

function insDwell(){const out={};ST_ORDER.forEach(st=>out[st]=[]);(S.trans||[]).forEach(e=>{if(e.dw!=null&&out[e.f])out[e.f].push(e.dw)});

  const r={};ST_ORDER.forEach(st=>{const a=out[st];r[st]={n:a.length,med:median(a),limit:a.length>=5?Math.max(5,Math.round(median(a)*1.5)):14}});return r}

function insWeekday(){const s={1:[],2:[],3:[],4:[],5:[]};insWin(120).forEach(k=>{const d=pD(k).getDay();if(!s[d])return;if(!actWorkday(k))return;const e=S.days[k];if(!e||worked(e)==null)return;const a=actOf(k);s[d].push(a.demo+a.ops.length*2)});
  const avg=Object.entries(s).map(([d,a])=>({d:+d,n:a.length,v:a.length?a.reduce((x,y)=>x+y,0)/a.length:0}));const ok=avg.filter(x=>x.n>=3);if(ok.length<3)return null;const best=ok.reduce((a,b)=>b.v>a.v?b:a);const worst=ok.reduce((a,b)=>b.v<a.v?b:a);return{avg,best,worst}}
function insLongDays(){const lo=[],hi=[];insWin(120).forEach(k=>{const e=S.days[k];const w=e&&!isFree(e.type)?worked(e):null;if(w==null||!actWorkday(k))return;const a=actOf(k);const v=a.demo+a.ops.length*2;(w>=9?hi:lo).push(v)});if(hi.length<4||lo.length<4)return null;const A=a=>a.reduce((x,y)=>x+y,0)/a.length;return{hi:A(hi),lo:A(lo),nh:hi.length}}
function insFcAcc(){const cm=ymOf(new Date());const ms=[...new Set((S.fcSubs||[]).map(x=>x.m))].filter(m=>m<cm);const rows=ms.map(m=>{const L=(S.fcSubs||[]).filter(x=>x.m===m);const first=L[0];const act=rev(m).tot;return first&&first.exp?{m,fc:first.exp,act,dev:(first.exp-act)/Math.max(1,act)*100}:null}).filter(Boolean);if(!rows.length)return null;return{rows,avg:rows.reduce((s,r)=>s+r.dev,0)/rows.length}}

function insBackcalc(){const cm=ymOf(new Date());const r=rev(cm);if(!r.target)return null;const gap=r.target-r.tot;const ds=insDealSize();const b=insBase();if(gap<=0)return{done:true};
  const FD=funnelData();const avg=FD.avg||null;if(!avg)return null;const deals=Math.ceil(gap/avg);

function insMonthEnd(){const L=realDeals();const ms=[...new Set(L.map(d=>d.date.slice(0,7)))].filter(m=>m<ymOf(new Date()));if(ms.length<2)return null;let tot=0,end=0;L.forEach(d=>{const m=d.date.slice(0,7);if(!ms.includes(m))return;tot+=+d.amount;const last=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();if(+d.date.slice(8)>last-7)end+=+d.amount});return tot?{share:end/tot*100,n:ms.length}:null}

function trCalc(){const y=ymd(new Date(Date.now()-864e5));const rS=ymd(new Date(pD(y)-27*864e5));const bE=ymd(new Date(pD(rS)-864e5));const bS0=ymd(new Date(pD(bE)-83*864e5));

  TR_DEF.forEach(m=>{const sd=m.since?m.since():null;const pend=()=>{let cur=null;try{const s0=sd&&sd>rS?sd:rS;if(!m.since||sd){const X=trWin(s0,y);cur=X.W.wd.length?m.c(X.K,X.W):null}}catch(e){}const eta=sd?ymd(new Date(pD(sd)-0+42*864e5)):null;out.pending.push({...m,cur,eta,sd})};
    if(m.since&&!sd){pend();return}let bS=bS0;if(sd&&sd>bS)bS=sd;if(bS>bE||rangeKs(bS,bE).length<14){pend();return}
    const B=trWin(bS,bE);if(B.W.wd.length<5||R.W.wd.length<5){pend();return}const cur=m.c(R.K,R.W),base=m.c(B.K,B.W);if(cur==null||base==null){pend();return}
    const diff=m.abs?cur-base:m.pt?cur-base:(base?(cur-base)/Math.abs(base)*100:(cur>0?100:0));const thr=m.thr!=null?m.thr:m.abs?({start:10,end:10,pause:5,ot:.75,office:.5}[m.id]??10):m.pt?8:10;const dir=Math.abs(diff)<thr?0:diff>0?1:-1;
    const good=m.g===0?0:dir*m.g;

function vVerlauf(){

  const vals={};years.forEach(y=>{for(let i=1;i<=12;i++){const k=`${y}-${pad(i)}`;vals[k]=heatVal(k)}});
  const R=v=>Math.round(v);
  const bestRow={},bestCol={};
  for(let i=1;i<=12;i++){let b=-1;years.forEach(y=>{const v=vals[`${y}-${pad(i)}`].v;if(v!=null&&R(v)>b)b=R(v)});bestRow[i]=b}
  years.forEach(y=>{let b=-1;for(let i=1;i<=12;i++){const v=vals[`${y}-${pad(i)}`].v;if(v!=null&&R(v)>b)b=R(v)}bestCol[y]=b});
  const isBest=(y,i,v)=>v!=null&&(mode==='year'?R(v)===bestCol[y]:R(v)===bestRow[i]);
  const avgOf=y=>{const a=[];for(let i=1;i<=12;i++){const v=vals[`${y}-${pad(i)}`].v;if(v!=null)a.push(v)}return a.length?{v:a.reduce((s,x)=>s+x,0)/a.length,n:a.length,hit:a.filter(x=>x>=100).length}:null};
  const avgs=years.map(avgOf);
  const valid=avgs.map((a,i)=>a&&{y:years[i],...a}).filter(Boolean);
  const bestY=valid.reduce((b,a)=>!b||a.v>b.v?a:b,null);
  const curA=avgs[years.indexOf(cy)];
  let allHit=0,allN=0;valid.forEach(a=>{allHit+=a.hit;allN+=a.n});

  </div>

    <div class="tile"><div class="ti" style="--tc:var(--amber)">${ic('trophy')}</div><div class="tl">Bester Monat ${cy}</div><div class="tv">${bestCur?R(bestCur.v):'–'}<small> %</small></div><div class="ts">${bestCur?MON[bestCur.i-1]:''}</div></div>
    <div class="tile"><div class="ti" style="--tc:var(--green)">${ic('crown')}</div><div class="tl">Bestes Jahr</div><div class="tv">${bestY?bestY.y:'–'}</div><div class="ts">${bestY?`Ø ${R(bestY.v)} %`:''}</div></div>
    <div class="tile"><div class="ti" style="--tc:var(--k)">${ic('flame')}</div><div class="tl">Über 100 %</div><div class="tv">${allHit}<small> von ${allN}</small></div><div class="ts">Monaten seit 2020</div></div>

function heatSheet(k){
  const h=heatVal(k);const [y,m]=k.split('-');

/* ---------- Jahresauszug (Steuer) ---------- */
function yearReport(y){
  const tk=todayK(); const months=[]; const tot={work:0,office:0,home:0,urlaub:0,krank:0,feiertag:0,weekend:0,hours:0};
  for(let i=1;i<=12;i++){const m=`${y}-${pad(i)}`;const r={m,work:0,office:0,urlaub:0,krank:0,feiertag:0,hours:0};
    monthDays(m).forEach(x=>{if(x.k>tk||x.k<S.settings.startMonth+'-01')return;const e=x.e;
      if(e&&!isFree(e.type)&&x.w>0){r.work++;r.hours+=x.w;if(e.type==='koeln')r.office++;if(x.weekend||x.hol)tot.weekend++}
      if(x.weekend)return;
      if(e&&e.type==='urlaub'&&!x.hol)r.urlaub++; if(e&&e.type==='halb')r.urlaub+=.5; if(x.sp)r.urlaub+=.5;
      if(e&&e.type==='krank'&&!x.hol)r.krank++;
      if(x.hol||(e&&e.type==='feiertag'))r.feiertag++;});
    months.push(r);['work','office','urlaub','krank','feiertag','hours'].forEach(k=>tot[k]+=r[k]);}
  tot.home=tot.work-tot.office; tot.urlaubVorher=+(S.settings.urlaubVorher[y]||0); tot.urlaubAll=tot.urlaub+tot.urlaubVorher; return {y,months,tot};
}
function reportCsv(y){const R=yearReport(y);const rows=[[`Jahresauszug ${y}`,S.settings.name||''],[],['Monat','Arbeitstage','davon Office','ohne Office','Urlaubstage','Krankheitstage','Feiertage (Mo–Fr)','Stunden']];
  R.months.forEach(r=>rows.push([MON[+r.m.slice(5)-1],r.work,r.office,r.work-r.office,fmtN(r.urlaub,1),r.krank,r.feiertag,fmtN(r.hours,2)]));
  const t=R.tot;rows.push(['Summe',t.work,t.office,t.home,fmtN(t.urlaub,1),t.krank,t.feiertag,fmtN(t.hours,2)]);rows.push([]);rows.push(['davon an Wochenenden/Feiertagen gearbeitet',t.weekend]);if(t.urlaubVorher)rows.push(['Urlaubstage vor App-Start',fmtN(t.urlaubVorher,1)]);rows.push(['Urlaubstage gesamt',fmtN(t.urlaubAll,1)]);rows.push([`Erfasst ab ${mLabel(S.settings.startMonth)}`]);
  return '﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return /[;"\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c}).join(';')).join('\n')}

const SEC=()=>S.security||(S.security={});
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sd-salt:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let LOCKED=false,PINBUF='',FAILS=0,LOCKUNTIL=0,HIDDEN_AT=0;

function showLock(){if(!lockActive())return;LOCKED=true;PINBUF='';const el=document.getElementById('lock');
  el.innerHTML=`<div class="lk-in"><div class="lk-logo">${logoSvg(S.settings.logo)}</div><div class="lk-hi">${greet()}${S.settings.name?', '+esc(S.settings.name):''} ${greetEmo()}</div><div class="lk-sub" id="lkSub">PIN eingeben</div><div class="lk-dots" id="lkDots"><i></i><i></i><i></i><i></i></div>${SEC().faceId?`<button class="lk-face" onclick="tryFace()">${ic('faceid')} Mit Face ID entsperren</button>`:''}${padHtml('pinKey',!!SEC().faceId)}<button class="lk-forgot" onclick="forgotPin()">PIN vergessen?</button><div class="lk-ver">${verTxt()}</div></div>`;
  el.classList.remove('out');el.classList.add('on');document.documentElement.classList.add('islocked');document.documentElement.classList.remove('prelock');}
function dots(n,err){const d=document.getElementById('lkDots');if(!d)return;[...d.children].forEach((x,i)=>x.classList.toggle('f',i<n));d.classList.toggle('err',!!err);if(err){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}}
async function pinKey(k){if(Date.now()<LOCKUNTIL)return;if(k==='del'){PINBUF=PINBUF.slice(0,-1);dots(PINBUF.length);return}if(PINBUF.length>=4)return;PINBUF+=k;dots(PINBUF.length);
  if(PINBUF.length===4){const h=await sha(PINBUF);if(h===SEC().pin){FAILS=0;unlock()}else{FAILS++;dots(4,true);if(navigator.vibrate)try{navigator.vibrate([30,40,30])}catch(e){}const sub=document.getElementById('lkSub');
    if(FAILS>=5){LOCKUNTIL=Date.now()+30000;sub.textContent='Zu viele Versuche. Bitte 30 Sekunden warten.';setTimeout(()=>{FAILS=0;const s2=document.getElementById('lkSub');if(s2)s2.textContent='PIN eingeben'},30000)}else sub.textContent='Falsche PIN, bitte nochmal';
    setTimeout(()=>{PINBUF='';dots(0)},450)}}}
function unlock(){LOCKED=false;setTimeout(()=>{const k=document.getElementById('kick');if(!(k&&k.classList.contains('on')))festMaybe()},1800);const el=document.getElementById('lock');
  const plain=()=>{ANIM_PENDING=true;setTimeout(render,60);el.classList.add('out');document.documentElement.classList.remove('islocked','prelock');setTimeout(()=>{el.classList.remove('on','out','fx');el.innerHTML=''},420);setTimeout(()=>afterInitial(dailyFlow),450)};
  if(RM()||!el.classList.contains('on')){plain();return}

    <svg class="ufx-dart" viewBox="-10 -150 160 160" overflow="visible"><g transform="rotate(45)"><path d="M0 0 L-5 -16 L5 -16Z" fill="#F3F4F8"/><rect x="-3" y="-60" width="6" height="46" rx="3" fill="#F3F4F8"/><rect x="-4.5" y="-74" width="9" height="16" rx="3" fill="#F9DC4A"/><path d="M0 -74 L-16 -104 L-3 -96 Z M0 -74 L16 -104 L3 -96 Z" fill="#F9DC4A"/><path d="M0 -76 L0 -108" stroke="#F9DC4A" stroke-width="3" stroke-linecap="round"/></g></svg></div>
    <div class="ufx-txt"><b>Volltreffer!</b><span>Los geht's${nm} 🎯</span></div>`;
  el.appendChild(fx);el.classList.add('fx');
  setTimeout(()=>fx.classList.add('hit'),560);
  setTimeout(()=>{ANIM_PENDING=true;render();document.documentElement.classList.remove('islocked','prelock');document.documentElement.classList.add('appin');el.classList.add('zoomout')},1250);
  setTimeout(()=>{el.classList.remove('on','out','fx','zoomout');el.innerHTML='';document.documentElement.classList.remove('appin')},1800);
  setTimeout(()=>afterInitial(dailyFlow),1850)}

function drawPin(){const t={0:'Aktuelle PIN',1:'Neue PIN',2:'Neue PIN wiederholen'}[PS.step];
  openSheet(`${sheetHead(PS.mode==='off'?'PIN entfernen':lockActive()?'PIN ändern':'PIN festlegen')}<div class="pin-setup"><div class="lk-sub" id="psSub" style="color:var(--muted)">${PS.mode==='off'&&PS.step===0?'Zum Entfernen aktuelle PIN eingeben':t}</div><div class="lk-dots light" id="psDots">${[0,1,2,3].map(i=>`<i class="${i<PS.buf.length?'f':''}"></i>`).join('')}</div>${padHtml('psKey',false)}</div>`)}
async function psKey(k){if(k==='del'){PS.buf=PS.buf.slice(0,-1)}else if(PS.buf.length<4)PS.buf+=k;const d=document.getElementById('psDots');[...d.children].forEach((x,i)=>x.classList.toggle('f',i<PS.buf.length));if(PS.buf.length<4)return;
  const bad=m=>{document.getElementById('psSub').textContent=m;d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake','err');setTimeout(()=>{PS.buf='';drawPin();document.getElementById('psSub').textContent=m},500)};
  if(PS.step===0){if(await sha(PS.buf)!==SEC().pin)return bad('Falsche PIN');if(PS.mode==='off'){delete SEC().pin;delete SEC().faceId;save();closeSheet();render();toast('PIN entfernt','ok');return}PS.step=1;PS.buf='';return drawPin()}
  if(PS.step===1){PS.first=PS.buf;PS.step=2;PS.buf='';return drawPin()}
  if(PS.buf!==PS.first){PS.step=1;PS.first='';return bad('PINs stimmen nicht überein, nochmal')}
  SEC().pin=await sha(PS.buf);if(SEC().after==null)SEC().after=1;save();closeSheet();render();toast('PIN gespeichert','ok')}
